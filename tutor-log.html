const EXAM_TYPES = ["小考", "段考", "模考", "其他"];

function ExamsPage({ students, examRecords, setExamRecords }) {
  const [studentId, setStudentId] = useState(students[0]?.id || "");
  const [date, setDate] = useState(todayStr());
  const [endDate, setEndDate] = useState("");
  const [examType, setExamType] = useState(EXAM_TYPES[0]);
  const [examName, setExamName] = useState("");
  const [score, setScore] = useState("");
  const [maxScore, setMaxScore] = useState(100);
  const [content, setContent] = useState("");
  const [editingId, setEditingId] = useState(null);
  const records = examRecords.filter((r) => r.studentId === studentId).sort((a, b) => b.date.localeCompare(a.date));

  function resetForm() {
    setEditingId(null); setDate(todayStr()); setEndDate(""); setExamType(EXAM_TYPES[0]);
    setExamName(""); setScore(""); setMaxScore(100); setContent("");
  }
  function startEdit(r) {
    setEditingId(r.id);
    setDate(r.date); setEndDate(r.endDate || ""); setExamType(r.examType); setExamName(r.examName);
    setScore(r.score == null ? "" : String(r.score)); setMaxScore(r.maxScore); setContent(r.content || "");
  }
  function saveRecord() {
    if (!examName.trim()) return;
    const payload = {
      studentId, date, endDate: endDate && endDate > date ? endDate : "", examType, examName: examName.trim(),
      score: score === "" ? null : Number(score), maxScore: Number(maxScore || 100), content: content.trim(),
    };
    if (editingId) {
      setExamRecords((prev) => prev.map((r) => r.id === editingId ? { ...r, ...payload } : r));
    } else {
      setExamRecords((prev) => [...prev, { id: uid(), ...payload }]);
    }
    resetForm();
  }
  function removeRecord(id) {
    setExamRecords((prev) => prev.filter((r) => r.id !== id));
    if (editingId === id) resetForm();
  }

  if (students.length === 0) return <div style={S.emptyState}>還沒有學生，先到「學生名冊」新增。</div>;

  return (
    <div>
      <div style={S.label}>選擇學生</div>
      <select style={S.input} value={studentId} onChange={(e) => { setStudentId(e.target.value); resetForm(); }}>
        {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
      </select>
      <div style={S.progressBox}>
        <div style={S.label}>{editingId ? "編輯考試" : "新增考試（可以先只填日期，成績之後再補）"}</div>
        <div style={S.twoCol}>
          <div>
            <label style={S.label}>日期</label>
            <input style={S.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
          <div>
            <label style={S.label}>考到第幾天（選填，段考/模考常常不只一天）</label>
            <input style={S.input} type="date" value={endDate} min={date} onChange={(e) => setEndDate(e.target.value)} />
          </div>
        </div>
        <label style={S.label}>考試類型</label>
        <select style={S.input} value={examType} onChange={(e) => setExamType(e.target.value)}>
          {EXAM_TYPES.map((t) => <option key={t}>{t}</option>)}
        </select>
        <label style={S.label}>考試名稱</label>
        <input style={S.input} placeholder="例：Unit 5 小考、3 月模考" value={examName} onChange={(e) => setExamName(e.target.value)} />
        <div style={S.twoCol}>
          <div>
            <label style={S.label}>得分（選填，考完再回來補）</label>
            <input style={S.input} type="number" value={score} onChange={(e) => setScore(e.target.value)} />
          </div>
          <div>
            <label style={S.label}>滿分</label>
            <input style={S.input} type="number" value={maxScore} onChange={(e) => setMaxScore(e.target.value)} />
          </div>
        </div>
        <label style={S.label}>考試內容（選填）</label>
        <textarea style={S.textarea} rows={2} placeholder="例：Unit 5 單字、長母音 oa 拼讀規則" value={content} onChange={(e) => setContent(e.target.value)} />
        {editingId ? (
          <div style={S.btnRow}>
            <button style={S.cancelBtnInline} onClick={resetForm}>取消編輯</button>
            <button style={S.primaryBtnInline} onClick={saveRecord}>更新這筆</button>
          </div>
        ) : (
          <button style={S.darkBtn} onClick={saveRecord}>＋ 加入成績</button>
        )}

        {records.length === 0 && <div style={{ ...S.emptyState, padding: "20px 0" }}>尚無成績紀錄</div>}
        {records.map((r) => (
          <div key={r.id} style={S.recordRow}>
            <div style={S.rowBetween}>
              <div>
                <span style={{ fontWeight: 500 }}>{r.examName}</span> <span style={S.goldTag}>{r.examType}</span>
              </div>
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <button style={S.smallBtn} onClick={() => startEdit(r)}>編輯</button>
                <X size={14} style={{ cursor: "pointer", color: "var(--coral)" }} onClick={() => { if (window.confirm("確定要刪除這筆考試紀錄嗎？")) removeRecord(r.id); }} />
              </div>
            </div>
            <div style={S.muted}>{r.date}{r.endDate ? `～${r.endDate}` : ""} · {r.score == null ? "尚未考（先記日期）" : `${r.score} / ${r.maxScore} 分`}{r.content ? ` · ${r.content}` : ""}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function PointsPage({ students, pointCategories, setPointCategories, pointLogs, setPointLogs }) {
  const [tab, setTab] = useState("quick"); // quick | rank | categories
  const [studentId, setStudentId] = useState(students[0]?.id || "");
  const [flash, setFlash] = useState(null);
  const [newCat, setNewCat] = useState({ emoji: "⭐", label: "", value: 1 });

  function studentTotal(sid) {
    return pointLogs.filter((p) => p.studentId === sid).reduce((a, p) => a + Number(p.value || 0), 0);
  }
  function logPoint(cat) {
    setPointLogs((prev) => [...prev, { id: uid(), studentId, categoryId: cat.id, value: cat.value, date: todayStr() }]);
    setFlash(cat.id);
    setTimeout(() => setFlash(null), 500);
  }
  function addCategory() {
    if (!newCat.label.trim()) return;
    setPointCategories((prev) => [...prev, { id: uid(), emoji: newCat.emoji || "⭐", label: newCat.label.trim(), value: Number(newCat.value || 0) }]);
    setNewCat({ emoji: "⭐", label: "", value: 1 });
  }
  function removeCategory(id) {
    setPointCategories((prev) => prev.filter((c) => c.id !== id));
  }

  if (students.length === 0) return <div style={S.emptyState}>還沒有學生，先到「學生名冊」新增。</div>;

  return (
    <div>
      <div style={S.tabToggle}>
        <button style={S.tabBtn(tab === "quick")} onClick={() => setTab("quick")}>快速登記</button>
        <button style={S.tabBtn(tab === "rank")} onClick={() => setTab("rank")}>排行榜</button>
        <button style={S.tabBtn(tab === "categories")} onClick={() => setTab("categories")}>類別設定</button>
      </div>

      {tab === "quick" && (
        <div style={{ marginTop: 12 }}>
          <div style={S.label}>選擇學生</div>
          <select style={S.input} value={studentId} onChange={(e) => setStudentId(e.target.value)}>
            {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          <div style={{ ...S.muted, margin: "8px 0" }}>目前累積：<strong style={{ color: "var(--ink)" }}>{studentTotal(studentId)}</strong> 分</div>
          <div style={S.pointGrid}>
            {pointCategories.map((c) => (
              <button key={c.id} style={{ ...S.pointBtn, ...(flash === c.id ? S.pointBtnFlash : {}) }} onClick={() => logPoint(c)}>
                <div style={{ fontSize: 24 }}>{c.emoji}</div>
                <div>{c.label}</div>
                <div style={{ color: c.value >= 0 ? "var(--green-text)" : "var(--coral-text)", fontWeight: 700 }}>{c.value >= 0 ? "+" : ""}{c.value}</div>
              </button>
            ))}
          </div>
        </div>
      )}

      {tab === "rank" && (
        <div style={{ marginTop: 12 }}>
          {[...students].sort((a, b) => studentTotal(b.id) - studentTotal(a.id)).map((s, i) => (
            <div key={s.id} style={S.rankRow}>
              <span style={S.rankNum}>{i + 1}</span>
              <span style={{ flex: 1, fontWeight: 500 }}>{s.name}</span>
              <span style={S.moneyText}>{studentTotal(s.id)} 分</span>
            </div>
          ))}
        </div>
      )}

      {tab === "categories" && (
        <div style={{ marginTop: 12 }}>
          {pointCategories.map((c) => (
            <div key={c.id} style={S.rowBetween}>
              <span>{c.emoji} {c.label}（{c.value >= 0 ? "+" : ""}{c.value}）</span>
              <X size={14} style={{ cursor: "pointer", color: "var(--coral)" }} onClick={() => removeCategory(c.id)} />
            </div>
          ))}
          <div style={{ ...S.rowInputs, marginTop: 10 }}>
            <input style={{ ...S.inputSm, width: 50 }} placeholder="🎯" value={newCat.emoji} onChange={(e) => setNewCat({ ...newCat, emoji: e.target.value })} />
            <input style={{ ...S.inputSm, flex: 1 }} placeholder="類別名稱" value={newCat.label} onChange={(e) => setNewCat({ ...newCat, label: e.target.value })} />
            <input style={{ ...S.inputSm, width: 60 }} type="number" value={newCat.value} onChange={(e) => setNewCat({ ...newCat, value: e.target.value })} />
            <button style={S.darkBtn} onClick={addCategory}>+ 新增</button>
          </div>
        </div>
      )}
    </div>
  );
}

}
