function calcQuick(counts, rate) {
  let hours = 0, days = 0;
  DURATIONS.forEach((d, i) => {
    const c = parseFloat(counts[i]) || 0;
    hours += d * c; days += c;
  });
  const fee = Math.round(hours * (parseFloat(rate) || 0));
  return { days: Math.round(days * 10) / 10, hours: Math.round(hours * 10) / 10, fee };
}

// ---- Sign-in (only needed once the database rules require it) ----
// Web API key: Firebase 主控台 → 專案設定 → 一般 → 網頁 API 金鑰.

const FB_API_KEY = "AIzaSyCpkWhJQP6g0PP7SaGCaLIurJuRFiHfQOE";
const AUTH = { token: null, uid: null, email: null, exp: 0, refresh: null };
function authApiKey() {
  try { return FB_API_KEY || localStorage.getItem("kejizhu_apikey") || ""; } catch (e) { return FB_API_KEY; }
}
function authSaveApiKey(k) { try { localStorage.setItem("kejizhu_apikey", k); } catch (e) {} }
function authStore(v) {
  try {
    if (v) localStorage.setItem("kejizhu_auth", JSON.stringify(v));
    else localStorage.removeItem("kejizhu_auth");
  } catch (e) {}
}
function authRead() {
  try { return JSON.parse(localStorage.getItem("kejizhu_auth") || "null"); } catch (e) { return null; }
}
function authApply(idToken, refreshToken, uid, email, expiresIn) {
  AUTH.token = idToken;
  AUTH.refresh = refreshToken;
  AUTH.uid = uid || AUTH.uid;
  AUTH.email = email || AUTH.email;
  AUTH.exp = Date.now() + (Number(expiresIn || 3600) * 1000);
  authStore({ refresh: AUTH.refresh, uid: AUTH.uid, email: AUTH.email });
}
async function authSignIn(email, password) {
  const key = authApiKey();
  if (!key) return { ok: false, msg: "還沒填網頁 API 金鑰" };
  try {
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${key}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, returnSecureToken: true }),
    });
    const j = await r.json();
    if (!r.ok) {
      const code = (j.error && j.error.message) || "";
      const msg = /EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD/.test(code) ? "帳號或密碼不對"
        : /API key not valid|API_KEY/i.test(code) ? "API 金鑰不對"
        : /PASSWORD_LOGIN_DISABLED|OPERATION_NOT_ALLOWED/.test(code) ? "Firebase 還沒開啟「電子郵件/密碼」登入方式"
        : /TOO_MANY_ATTEMPTS/.test(code) ? "嘗試太多次，請等幾分鐘再試" : code || "登入失敗";
      return { ok: false, msg };
    }
    authApply(j.idToken, j.refreshToken, j.localId, j.email, j.expiresIn);
    return { ok: true };
  } catch (e) {
    return { ok: false, msg: "連不上網路" };
  }
}
async function authRefresh() {
  const key = authApiKey();
  const saved = authRead();
  const rt = AUTH.refresh || (saved && saved.refresh);
  if (!key || !rt) return null;
  try {
    const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${key}`, {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(rt)}`,
    });
    if (!r.ok) { if (r.status === 400) authStore(null); return null; }
    const j = await r.json();
    authApply(j.id_token, j.refresh_token, j.user_id || (saved && saved.uid), saved && saved.email, j.expires_in);
    return AUTH.token;
  } catch (e) {
    return null;
  }
}
async function authToken() {
  if (AUTH.token && Date.now() < AUTH.exp - 60000) return AUTH.token;
  return await authRefresh();
}
function authSignOut() { AUTH.token = null; AUTH.refresh = null; AUTH.uid = null; AUTH.email = null; AUTH.exp = 0; authStore(null); }
async function authInit() {
  const saved = authRead();
  if (!saved) return false;
  AUTH.uid = saved.uid; AUTH.email = saved.email; AUTH.refresh = saved.refresh;
  return !!(await authRefresh());
}
// Every call to the database goes through here so it carries the sign-in token
// whenever we have one. 401/403 means "the rules want a login".
async function fbFetch(url, options) {
  const t = await authToken();
  const full = t ? `${url}${url.includes("?") ? "&" : "?"}auth=${encodeURIComponent(t)}` : url;
  const r = await fetch(full, options);
  return { r, denied: r.status === 401 || r.status === 403 };
}
// Returns { ok, data }. ok=false means "couldn't reach the cloud" — in that case
// we must NOT push anything back, or a stale copy would overwrite the cloud.
async function cloudLoad() {
  try {
    const { r, denied } = await fbFetch(FB_URL, { cache: "no-store" });
    if (denied) return { ok: false, needAuth: true, reason: "auth", data: null };
    if (!r.ok) return { ok: false, reason: "http" + r.status, data: null };
    const j = await r.json();
    return { ok: true, data: j && typeof j === "object" ? j : null };
  } catch (e) {
    return { ok: false, reason: (typeof navigator !== "undefined" && navigator.onLine === false) ? "offline" : "network", data: null };
  }
}
async function cloudSave(state) {
  try {
    const { r, denied } = await fbFetch(FB_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
    return { ok: r.ok, needAuth: denied };
  } catch (e) {
    return { ok: false };
  }
}

// ======================= 預約功能 =======================
// Availability lives in a SEPARATE Firebase database so the public booking page
// never reveals where the main tutor_log data is. Only free time blocks are
// published there — no student names, no fees.
// Booking data lives in the SAME database as everything else, under its own
// top-level path, the same way tutor_log / tutor_fees / s1_mathplan already do.
const FB_ROOT = FB_URL.replace(/\/[^/]*\.json$/, "");
const BOOKING_PATH = "tutor_booking";
const GRID_START = 6 * 60, GRID_END = 23 * 60; // 06:00–23:00
const SLOT = 30;
const ONLINE_TOOLS = ["Google Meet", "Zoom", "LINE 視訊", "Teams", "其他"];
const DEFAULT_BOOKING = {
  enabled: false, dbUrl: "", pageUrl: "",
  note: "段考前要加課，可以直接在這裡選時間送出，老師確認後會再跟您聯絡 🙂",
  mode: "inperson", area: "", onlineTool: "Google Meet", meetLink: "",
  daysAhead: 21, minNoticeHours: 12, buffer: 0, durations: [1, 1.5, 2],
  autoConfirm: false, skipHolidays: true,
  weekly: {}, overrides: {},
};
const BOOKING_DURATIONS = [1, 1.5, 2, 2.5, 3];
function toMin(t) { const p = String(t || "0:0").split(":"); return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0); }
function toTime(m) { return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; }
function rangeSlots(start, end) {
  const out = [];
  for (let m = toMin(start); m + SLOT <= toMin(end); m += SLOT) out.push(toTime(m));
  return out;
}
// Older saves stored {start,end} ranges; the grid uses explicit 30-min blocks.
function toSlotList(v) {
  if (!Array.isArray(v)) return [];
  const out = [];
  v.forEach((x) => {
    if (typeof x === "string") out.push(x);
    else if (x && x.start && x.end) rangeSlots(x.start, x.end).forEach((t) => out.push(t));
  });
  return Array.from(new Set(out)).sort();
}
function normalizeBooking(v) {
  const b = { ...DEFAULT_BOOKING, ...(v && typeof v === "object" ? v : {}) };
  const weekly = {};
  for (let d = 0; d < 7; d++) weekly["w" + d] = toSlotList((b.weekly || {})["w" + d]);
  b.weekly = weekly;
  const ov = {};
  Object.entries(b.overrides || {}).forEach(([date, o]) => {
    if (!o) return;
    if (o.blocked) ov[date] = { blocked: true };
    else if (o.slots || o.ranges) ov[date] = { slots: toSlotList(o.slots || o.ranges) };
  });
  (b.blockedDates || []).forEach((date) => { if (!ov[date]) ov[date] = { blocked: true }; });
  delete b.blockedDates;
  b.overrides = ov;
  b.durations = (b.durations || []).map(Number).filter((n) => n > 0).sort((a, c) => a - c);
  return b;
}
function dbBase(url) { return String(url || "").trim().replace(/\/+$/, "").replace(/\.json$/, "").replace(/\/+$/, ""); }
// Where the booking data actually lives. Empty dbUrl = the usual place.
function bookingBase(bs) { return dbBase(bs && bs.dbUrl) || `${FB_ROOT}/${BOOKING_PATH}`; }
// Never let a typo point the booking writer at the main data.
function bookingBaseUnsafe(bs) {
  const b = bookingBase(bs);
  return b === FB_ROOT || /\/tutor_log$|\/tutor_fees$/.test(b);
}
function defaultBookingPageUrl() {
  try { return location.href.split(/[?#]/)[0].replace(/[^/]*$/, "") + "booking.html"; } catch (e) { return "booking.html"; }
}
function bookingLink(bs) {
  const page = (bs.pageUrl || "").trim() || defaultBookingPageUrl();
  // booking.html already defaults to the usual place, so the common case gets a
  // short, clean link; only a custom location needs the ?db= suffix.
  if (bookingBase(bs) === `${FB_ROOT}/${BOOKING_PATH}`) return page;
  return `${page}${page.includes("?") ? "&" : "?"}db=${encodeURIComponent(bookingBase(bs))}`;
}
async function bookingReq(bs, path, method = "GET", body) {
  const base = bookingBase(bs);
  if (!base || bookingBaseUnsafe(bs)) return { ok: false, data: null };
  try {
    const { r, denied } = await fbFetch(`${base}/${path}.json`, {
      method, cache: "no-store",
      headers: body !== undefined ? { "Content-Type": "application/json" } : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) return { ok: false, needAuth: denied, data: null };
    return { ok: true, data: method === "DELETE" ? null : await r.json() };
  } catch (e) {
    return { ok: false, data: null };
  }
}
// A request still holds a slot while it is pending, or accepted but not yet
// turned into a lesson.
function reqHoldsSlot(r) { return r.status === "pending" || (r.status === "accepted" && !r.teacherLessonId); }
function needsAction(r) { return reqHoldsSlot(r) || !!r.cancelRequested; }
function occupies(l) { return l.time && l.status !== "leave" && l.courseType !== "請假（不計費）"; }
function busyOn(date, lessons, requests, buffer, ignoreReqId) {
  const out = [];
  lessons.forEach((l) => {
    if (l.date !== date || !occupies(l)) return;
    const s = toMin(l.time);
    out.push({ a: s - buffer, b: s + Number(l.hours || 0) * 60 + buffer, lesson: l });
  });
  (requests || []).forEach((r) => {
    if (!reqHoldsSlot(r) || r.date !== date || r.id === ignoreReqId) return;
    const s = toMin(r.time);
    out.push({ a: s - buffer, b: s + Number(r.hours || 0) * 60 + buffer, req: r });
  });
  return out;
}
// What the weekly template / date override says about one date, before lessons.
function daySlots(bs, date) {
  const ov = (bs.overrides || {})[date];
  if (ov && ov.blocked) return [];
  if (ov && ov.slots) return ov.slots;
  if (bs.skipHolidays && HOLIDAYS[date]) return [];
  return (bs.weekly || {})["w" + new Date(date + "T00:00:00").getDay()] || [];
}
function freeBlocksOn(date, bs, lessons, requests, nowMs) {
  const slots = daySlots(bs, date);
  if (!slots.length) return [];
  const busy = busyOn(date, lessons, requests, Number(bs.buffer || 0));
  const earliest = nowMs + Number(bs.minNoticeHours || 0) * 3600000;
  return slots.filter((t) => {
    const m = toMin(t);
    if (new Date(`${date}T${t}:00`).getTime() < earliest) return false;
    return !busy.some((x) => m < x.b && m + SLOT > x.a);
  });
}
// Earliest start / latest end anywhere in the schedule, so the student page can
// draw the same time rows every week.
function weeklyRange(bs) {
  let a = 24 * 60, b = 0;
  const eat = (list) => (list || []).forEach((t) => { a = Math.min(a, toMin(t)); b = Math.max(b, toMin(t) + SLOT); });
  Object.values(bs.weekly || {}).forEach(eat);
  Object.values(bs.overrides || {}).forEach((o) => o && o.slots && eat(o.slots));
  return a < b ? [toTime(a), toTime(b)] : ["16:00", "21:00"];
}
function buildAvailability(bs, lessons, requests) {
  const now = Date.now();
  const days = {};
  const start = todayStr();
  for (let i = 0; i <= Number(bs.daysAhead || 0); i++) {
    const date = addDays(start, i);
    const blocks = freeBlocksOn(date, bs, lessons, requests, now);
    if (blocks.length) days[date] = blocks;
  }
  return {
    updatedAt: now, teacher: TEACHER_NAME, note: bs.note || "",
    mode: bs.mode, area: bs.area || "", onlineTool: bs.onlineTool || "",
    autoConfirm: !!bs.autoConfirm, durations: (bs.durations || []).slice().sort((a, b) => a - b),
    minNoticeHours: Number(bs.minNoticeHours || 0), buffer: Number(bs.buffer || 0),
    from: start, until: addDays(start, Number(bs.daysAhead || 0)), range: weeklyRange(bs), days,
  };
}
function weekHours(weekly) {
  return Object.values(weekly || {}).reduce((a, l) => a + (l || []).length, 0) / 2;
}
function dateLabel(date) {
  const d = new Date(date + "T00:00:00");
  return `${d.getMonth() + 1}/${d.getDate()}（${weekdayLabel(d.getDay())}）`;
}

// Every key that lives in the cloud copy, with its default. Keeping this in one
// place guarantees load, save and compare all use the exact same shape.
function stateDefaults() {
  return {
    students: SEED_STUDENTS, lessons: SEED_LESSONS, fees: [], settled: [], quickTally: {},
    activePeriodic: [], trialRate: 250, weaknessNotes: [], examRecords: [], progressList: [],
    pointCategories: DEFAULT_POINT_CATEGORIES, pointLogs: [], homeworkList: [], bookingSettings: DEFAULT_BOOKING,
  };
}
const STATE_KEYS = Object.keys(stateDefaults());
function pickState(src) {
  const d = stateDefaults();
  const o = {};
  STATE_KEYS.forEach((k) => {
    const v = src ? src[k] : undefined;
    o[k] = v === undefined || v === null ? d[k] : v;
  });
  o.bookingSettings = normalizeBooking(src ? src.bookingSettings : null);
  return o;
}
// Anything in the cloud this version of the app doesn't know about — kept and
// written back untouched so a save never silently deletes it.
function extraKeys(cloud) {
  const o = {};
  if (cloud) Object.keys(cloud).forEach((k) => { if (!STATE_KEYS.includes(k)) o[k] = cloud[k]; });
  return o;
}
function downloadBackup(state) {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `課跡備份-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function App() {
  const [ready, setReady] = useState(false);
  const [students, setStudents] = useState(SEED_STUDENTS);
  const [lessons, setLessons] = useState(SEED_LESSONS);
  const [fees, setFees] = useState([]);
  const [settled, setSettled] = useState([]);
  const [quickTally, setQuickTally] = useState({});
  const [activePeriodic, setActivePeriodic] = useState([]);
  const [trialRate, setTrialRate] = useState(250);
  const [weaknessNotes, setWeaknessNotes] = useState([]);
  const [examRecords, setExamRecords] = useState([]);
  const [progressList, setProgressList] = useState([]);
  const [pointCategories, setPointCategories] = useState(DEFAULT_POINT_CATEGORIES);
  const [pointLogs, setPointLogs] = useState([]);
  const [homeworkList, setHomeworkList] = useState([]);
  const [bookingSettings, setBookingSettings] = useState(DEFAULT_BOOKING);
  const [syncStatus, setSyncStatus] = useState("syncing"); // syncing | synced | error
  const [cloudOk, setCloudOk] = useState(false); // true only after we successfully READ the cloud
  const [needAuth, setNeedAuth] = useState(false); // database rules are asking for a login
  const [signedIn, setSignedIn] = useState(false);
  const [cloudErr, setCloudErr] = useState(""); // why the cloud couldn't be read: auth | offline | network | httpNNN
  const [, setTick] = useState(0);
  const lastSyncedRef = useRef("");
  const extrasRef = useRef({});
  const offlineBaseRef = useRef("");
  const stateRef = useRef(null);
  const [bookingReqs, setBookingReqs] = useState([]);
  const [bookingFetch, setBookingFetch] = useState({ ok: null, at: 0 });
  const [publishStatus, setPublishStatus] = useState({ ok: null, at: 0 });
  const bookingRef = useRef(DEFAULT_BOOKING);
  bookingRef.current = bookingSettings;

  const [tab, setTab] = useState("schedule");
  const [calMode, setCalMode] = useState("month");
  const [viewMonth, setViewMonth] = useState(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [moreView, setMoreView] = useState(null);

  const [logForm, setLogForm] = useState(null);
  const [scheduleForm, setScheduleForm] = useState(null);
  const [actionSheet, setActionSheet] = useState(null);
  const [editTimeLesson, setEditTimeLesson] = useState(null);
  const [dayPeek, setDayPeek] = useState(null); // { date, lessons }

  const currentState = pickState({
    students, lessons, fees, settled, quickTally, activePeriodic, trialRate,
    weaknessNotes, examRecords, progressList, pointCategories, pointLogs, homeworkList, bookingSettings,
  });
  stateRef.current = currentState;

  function applyState(st) {
    setStudents(st.students); setLessons(st.lessons); setFees(st.fees); setSettled(st.settled);
    setQuickTally(st.quickTally); setActivePeriodic(st.activePeriodic); setTrialRate(st.trialRate);
    setWeaknessNotes(st.weaknessNotes); setExamRecords(st.examRecords); setProgressList(st.progressList);
    setPointCategories(st.pointCategories); setPointLogs(st.pointLogs); setHomeworkList(st.homeworkList);
    setBookingSettings(st.bookingSettings);
  }
  function applyCloud(cloud) {
    const st = pickState(cloud);
    extrasRef.current = extraKeys(cloud);
    lastSyncedRef.current = JSON.stringify(st); // what the cloud has now — no need to push it back
    applyState(st);
  }
  async function loadLocal() {
    const local = {};
    for (const k of STATE_KEYS) {
      const v = await loadKey(k, null);
      if (v !== null && v !== undefined) local[k] = v;
    }
    return local;
  }

  async function startup() {
      const had = await authInit();
      if (had) setSignedIn(true);
      const res = await cloudLoad();
      if (res.needAuth) {
        // Rules require a login and we don't have a valid one.
        setCloudErr("auth");
        setNeedAuth(true);
        applyState(pickState(await loadLocal()));
        setSyncStatus("error");
        setReady(true);
        return;
      }
      if (res.ok && res.data) {
        applyCloud(res.data);
        setCloudOk(true);
        setSyncStatus("synced");
      } else if (res.ok) {
        // Cloud reachable but empty (first ever use) — start from this device's copy.
        applyState(pickState(await loadLocal()));
        setCloudOk(true);
      } else {
        // Cloud unreachable — use this device's copy so work isn't lost, but DON'T
        // write to the cloud until we've managed to read it (see retryCloud).
        const st = pickState(await loadLocal());
        offlineBaseRef.current = JSON.stringify(st);
        applyState(st);
        setCloudErr(res.reason || "network");
        setSyncStatus("error");
      }
      setReady(true);
  }
  useEffect(() => { startup(); }, []);

  async function afterSignIn() {
    setSignedIn(true);
    setNeedAuth(false);
    setReady(false);
    setSyncStatus("syncing");
    lastSyncedRef.current = "";
    const res = await cloudLoad();
    if (res.ok && res.data) { applyCloud(res.data); setCloudOk(true); setSyncStatus("synced"); }
    else if (res.ok) { setCloudOk(true); setSyncStatus("synced"); }
    else { setCloudErr(res.reason || "network"); setSyncStatus("error"); }
    setReady(true);
  }
  function signOutNow() {
    authSignOut();
    setSignedIn(false);
    setCloudOk(false);
    setNeedAuth(true);
  }

  // Debounced write-through: every change is mirrored to local storage
  // immediately, and to the shared cloud database shortly after.
  const currentJson = JSON.stringify(currentState);
  useEffect(() => {
    if (!ready) return;
    STATE_KEYS.forEach((k) => saveKey(k, currentState[k]));
    if (!cloudOk) { setSyncStatus("error"); return; }
    if (currentJson === lastSyncedRef.current) { setSyncStatus("synced"); return; }
    setSyncStatus("syncing");
    const t = setTimeout(async () => {
      const res = await cloudSave({ ...extrasRef.current, ...currentState });
      if (res.ok) lastSyncedRef.current = currentJson;
      if (res.needAuth) { setNeedAuth(true); setCloudOk(false); }
      setSyncStatus(res.ok ? "synced" : "error");
    }, 700);
    return () => clearTimeout(t);
  }, [currentJson, ready, cloudOk]);

  // Manual "reconnect" after the cloud was unreachable at startup.
  async function retryCloud() {
    setSyncStatus("syncing");
    const res = await cloudLoad();
    if (res.needAuth) {
      // Not a network problem — the database wants a login. Go to the login screen
      // (this device's data stays as it is).
      if (!offlineBaseRef.current) offlineBaseRef.current = JSON.stringify(stateRef.current);
      setCloudErr("auth"); setNeedAuth(true); setSyncStatus("error"); return;
    }
    if (!res.ok) { setCloudErr(res.reason || "network"); setSyncStatus("error"); return; }
    setCloudErr("");
    const changedOffline = JSON.stringify(stateRef.current) !== offlineBaseRef.current;
    if (res.data && changedOffline) {
      const upload = window.confirm("雲端連上了！\n\n剛剛離線時你在這台裝置有改過資料。\n按「確定」＝把這台裝置的版本上傳到雲端（會取代雲端上的版本）\n按「取消」＝改用雲端上的版本（這台剛剛的修改會捨棄）");
      if (upload) { extrasRef.current = extraKeys(res.data); lastSyncedRef.current = ""; }
      else applyCloud(res.data);
    } else if (res.data) {
      applyCloud(res.data);
    }
    setCloudOk(true);
  }

  // Coming back to this tab/app (e.g. after editing on another device): pull the
  // latest cloud copy so this device can't overwrite newer data.
  useEffect(() => {
    async function onVisible() {
      if (document.visibilityState !== "visible") return;
      setTick((n) => n + 1);
      fetchBookingRequests();
      if (!stateRef.current) return;
      if (JSON.stringify(stateRef.current) !== lastSyncedRef.current) return; // a save is pending
      const res = await cloudLoad();
      if (!res.ok || !res.data) return;
      if (JSON.stringify(stateRef.current) !== lastSyncedRef.current) return; // edited meanwhile
      if (JSON.stringify(pickState(res.data)) !== lastSyncedRef.current) applyCloud(res.data);
    }
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, []);

  // ---- Booking: read requests from the booking DB, publish free slots to it ----
  // What stays in the shared booking database after a request is handled:
  // just the times and the outcome, so no student can read another's details.
  function strippedReq(req, extra) {
    return { date: req.date, time: req.time, hours: Number(req.hours), createdAt: req.createdAt || 0, handledAt: Date.now(), ...extra };
  }
  function makeLessonFromReq(req, sid, courseType) {
    return {
      id: uid(), studentId: sid, date: req.date, time: req.time, hours: Number(req.hours),
      courseType: courseType || "正常上課", status: "scheduled",
      materials: [], homework: [], extra: {}, seriesId: null, bookingId: req.id,
    };
  }
  async function fetchBookingRequests() {
    const bs = bookingRef.current;
    if (!bs.enabled || bookingBaseUnsafe(bs)) return;
    const [rq, hd] = await Promise.all([bookingReq(bs, "requests"), bookingReq(bs, "holds")]);
    if (!rq.ok) { setBookingFetch({ ok: false, at: Date.now() }); return; }
    let list = Object.entries(rq.data || {})
      .filter(([, v]) => v && typeof v === "object")
      .map(([id, v]) => ({ ...v, id }));
    // Auto-confirmed bookings: create the lesson here, but only when the name
    // matches exactly one student. Anything else stays in the inbox.
    if (bs.autoConfirm) {
      for (const r of list) {
        if (r.status !== "accepted" || r.teacherLessonId) continue;
        const hit = stateRef.current.students.filter((s) => s.name.trim() === String(r.name || "").trim());
        if (hit.length !== 1) continue;
        const lesson = makeLessonFromReq(r, hit[0].id);
        upsertLesson(lesson);
        const slim = strippedReq(r, { status: "accepted", teacherLessonId: lesson.id, meetLink: bs.meetLink || "" });
        Object.assign(r, slim);
        bookingReq(bs, `requests/${r.id}`, "PUT", slim);
        bookingReq(bs, `holds/${r.holdId || r.id}`, "DELETE");
      }
    }
    // Housekeeping: drop holds that no longer reserve anything, and old handled requests.
    const holdIds = new Set(list.filter(reqHoldsSlot).map((r) => r.holdId || r.id));
    Object.keys((hd.ok && hd.data) || {}).forEach((id) => { if (!holdIds.has(id)) bookingReq(bs, `holds/${id}`, "DELETE"); });
    const cutoff = addDays(todayStr(), -45);
    list = list.filter((r) => {
      if (!needsAction(r) && r.date && r.date < cutoff) { bookingReq(bs, `requests/${r.id}`, "DELETE"); return false; }
      return true;
    });
    list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    setBookingReqs(list);
    setBookingFetch({ ok: true, at: Date.now() });
  }
  useEffect(() => {
    if (!ready) return;
    fetchBookingRequests();
    const t = setInterval(fetchBookingRequests, 90 * 1000);
    return () => clearInterval(t);
  }, [ready, bookingSettings.enabled, bookingSettings.dbUrl, bookingSettings.autoConfirm]);

  const openReqs = bookingReqs.filter(needsAction);
  const availabilityJson = useMemo(() => {
    if (!bookingSettings.enabled) return "";
    return JSON.stringify({ ...buildAvailability(bookingSettings, lessons, openReqs), updatedAt: 0 });
  }, [bookingSettings, lessons, bookingReqs, todayStr()]);
  async function publishAvailability() {
    const bs = bookingRef.current;
    if (!bs.enabled || bookingBaseUnsafe(bs)) return false;
    const payload = buildAvailability(bs, stateRef.current.lessons, bookingReqs.filter(needsAction));
    const r = await bookingReq(bs, "public", "PUT", payload);
    setPublishStatus({ ok: r.ok, at: Date.now() });
    return r.ok;
  }
  useEffect(() => {
    // Only publish once the real lessons are loaded from the cloud, so we never
    // advertise a slot that's actually taken.
    if (!ready || !cloudOk || !availabilityJson || bookingBaseUnsafe(bookingSettings)) return;
    const t = setTimeout(publishAvailability, 1500);
    return () => clearTimeout(t);
  }, [availabilityJson, ready, cloudOk, bookingSettings.dbUrl]);

  async function acceptBooking(req, { studentId, courseType }) {
    let sid = studentId;
    if (sid === "__new") {
      sid = uid();
      setStudents((prev) => [...prev, { id: sid, name: req.name, level: "elem", rate: 600, billingType: "hourly", periodicAmount: 0, household: "", pageUrl: "", textbooks: {}, note: "由預約新增，記得補鐘點費與教材版本" }]);
    }
    const bs = bookingRef.current;
    const lesson = makeLessonFromReq(req, sid, courseType);
    upsertLesson(lesson);
    const slim = strippedReq(req, { status: "accepted", teacherLessonId: lesson.id, meetLink: bs.meetLink || "" });
    setBookingReqs((prev) => prev.map((r) => r.id === req.id ? { ...slim, id: r.id } : r));
    const r = await bookingReq(bs, `requests/${req.id}`, "PUT", slim);
    await bookingReq(bs, `holds/${req.holdId || req.id}`, "DELETE");
    return r.ok;
  }
  async function declineBooking(req, reply) {
    const bs = bookingRef.current;
    const slim = strippedReq(req, { status: "declined", reply: reply || "" });
    setBookingReqs((prev) => prev.map((r) => r.id === req.id ? { ...slim, id: r.id } : r));
    const r = await bookingReq(bs, `requests/${req.id}`, "PUT", slim);
    await bookingReq(bs, `holds/${req.holdId || req.id}`, "DELETE");
    return r.ok;
  }
  // Student asked to cancel or move a lesson that was already confirmed.
  async function resolveCancelRequest(req, agree) {
    const bs = bookingRef.current;
    if (agree && req.teacherLessonId) removeLesson(req.teacherLessonId);
    const patch = agree
      ? { status: "cancelled", cancelRequested: null, teacherLessonId: null, handledAt: Date.now() }
      : { cancelRequested: null, keptAt: Date.now() };
    setBookingReqs((prev) => prev.map((r) => {
      if (r.id !== req.id) return r;
      const next = { ...r, ...patch };
      Object.keys(patch).forEach((k) => { if (patch[k] === null) delete next[k]; });
      return next;
    }));
    const r = await bookingReq(bs, `requests/${req.id}`, "PATCH", patch);
    await bookingReq(bs, `holds/${req.holdId || req.id}`, "DELETE");
    return r.ok;
  }
  async function removeBooking(req) {
    setBookingReqs((prev) => prev.filter((r) => r.id !== req.id));
    const bs = bookingRef.current;
    await bookingReq(bs, `requests/${req.id}`, "DELETE");
    await bookingReq(bs, `holds/${req.holdId || req.id}`, "DELETE");
  }
  function openBookings() { setTab("more"); setMoreView("booking"); }

  const studentById = (id) => students.find((s) => s.id === id);

  function upsertLesson(lesson) {
    setLessons((prev) => {
      const idx = prev.findIndex((l) => l.id === lesson.id);
      if (idx === -1) return [...prev, lesson];
      const next = [...prev];
      next[idx] = lesson;
      return next;
    });
  }
  function removeLesson(id) { setLessons((prev) => prev.filter((l) => l.id !== id)); }
  function removeFee(id) { setFees((prev) => prev.filter((f) => f.id !== id)); }
  function quickAttend(lesson) { upsertLesson({ ...lesson, status: "attended" }); }
  function bulkAttendDay(dateLessons) {
    setLessons((prev) => prev.map((l) => {
      if (dateLessons.some((d) => d.id === l.id) && l.status === "scheduled") return { ...l, status: "attended" };
      return l;
    }));
  }
  function seriesSiblings(lesson) {
    if (!lesson?.seriesId) return [];
    return lessons.filter((l) => l.seriesId === lesson.seriesId && l.status === "scheduled" && l.id !== lesson.id);
  }
  function applyTimeToSeries(lesson, time, hours) {
    setLessons((prev) => prev.map((l) => {
      if (l.seriesId === lesson.seriesId && l.status === "scheduled") return { ...l, time, hours };
      return l;
    }));
  }
  function deleteSeries(lesson) {
    setLessons((prev) => prev.filter((l) => !(l.seriesId === lesson.seriesId && l.status === "scheduled")));
  }
  function toggleHomework(lessonId, hwId) {
    setLessons((prev) => prev.map((l) => {
      if (l.id !== lessonId) return l;
      return { ...l, homework: l.homework.map((h) => h.id === hwId ? { ...h, done: !h.done } : h) };
    }));
  }
  function feesFor(studentId, month) {
    const list = fees.filter((f) => f.studentId === studentId && f.month === month);
    const add = list.filter((f) => f.type === "add").reduce((a, f) => a + Number(f.amount || 0), 0);
    const disc = list.filter((f) => f.type === "discount").reduce((a, f) => a + Number(f.amount || 0), 0);
    return { add, disc };
  }

  const lessonsOn = (date) => lessons.filter((l) => l.date === date).sort((a, b) => (a.time || "").localeCompare(b.time || ""));

  const monthBreakdown = useMemo(() => {
    const key = monthKey(viewMonth);
    return students.map((s) => {
      const k = qKey(s.id, key);
      if (quickTally[k]) return null; // billed through the quick tally instead, don't double count
      const monthLessons = lessons.filter((l) => l.studentId === s.id && l.date.startsWith(key) && l.status === "attended");
      const billableLessons = monthLessons.filter(isBillable);
      const hours = billableLessons.reduce((a, l) => a + Number(l.hours || 0), 0);
      let base;
      if (s.billingType === "periodic") {
        const active = billableLessons.length > 0 || activePeriodic.includes(k);
        base = active ? Number(s.periodicAmount || 0) : 0;
      } else {
        base = billableLessons.reduce((a, l) => a + Number(l.hours || 0) * effectiveRate(l, s, trialRate), 0);
      }
      const { add, disc } = feesFor(s.id, key);
      const total = base + add - disc;
      const show = monthLessons.length > 0 || add > 0 || disc > 0 || (s.billingType === "periodic" && activePeriodic.includes(k));
      if (!show) return null;
      const hasTrial = monthLessons.some((l) => l.courseType === "試聽課");
      return { student: s, hours, base, add, disc, total, count: billableLessons.length, hasTrial, isSettled: settled.includes(k), key: k };
    }).filter(Boolean);
  }, [students, lessons, fees, settled, activePeriodic, quickTally, trialRate, viewMonth]);

  const quickBreakdown = useMemo(() => {
    const key = monthKey(viewMonth);
    return Object.keys(quickTally)
      .filter((k) => k.endsWith("|" + key))
      .map((k) => {
        const sid = k.slice(0, k.length - ("|" + key).length);
        const s = studentById(sid);
        if (!s) return null;
        const counts = quickTally[k];
        const { days, hours, fee } = calcQuick(counts, s.rate);
        const { add, disc } = feesFor(sid, key);
        const total = fee + add - disc;
        return { student: s, counts, days, hours, base: fee, add, disc, total, key, isSettled: settled.includes(k) };
      }).filter(Boolean);
  }, [quickTally, students, fees, settled, viewMonth]);

  const allRows = [...monthBreakdown, ...quickBreakdown];
  const monthTotal = allRows.reduce((a, b) => a + b.total, 0);
  const settledPct = allRows.length ? Math.round((allRows.filter((b) => b.isSettled).length / allRows.length) * 100) : 0;

  const scheduledPreview = useMemo(() => {
    const key = monthKey(viewMonth);
    const upcoming = lessons.filter((l) => l.status === "scheduled" && l.date.startsWith(key));
    const amount = upcoming.reduce((a, l) => {
      const s = studentById(l.studentId);
      if (!s) return a;
      const rate = l.courseType === "試聽課" ? Number(trialRate || 0) : Number(s.rate || 0);
      return a + Number(l.hours || 0) * rate;
    }, 0);
    return { count: upcoming.length, amount };
  }, [lessons, students, trialRate, viewMonth]);

  const homeworkItems = useMemo(() => {
    const items = [];
    lessons.forEach((l) => {
      (l.homework || []).forEach((h) => {
        items.push({ ...h, source: "lesson", lessonId: l.id, studentId: l.studentId, date: l.date });
      });
    });
    homeworkList.forEach((h) => {
      items.push({ ...h, source: "standalone", date: h.assignedDate });
    });
    return items.sort((a, b) => {
      const da = a.dueDate || a.date, db = b.dueDate || b.date;
      return db.localeCompare(da);
    });
  }, [lessons, homeworkList]);

  function addStandaloneHomework(studentId, text, dueDate) {
    setHomeworkList((prev) => [...prev, { id: uid(), studentId, text, assignedDate: todayStr(), dueDate: dueDate || "", done: false }]);
  }
  function toggleStandaloneHomework(id) {
    setHomeworkList((prev) => prev.map((h) => h.id === id ? { ...h, done: !h.done } : h));
  }
  function deleteHomeworkItem(item) {
    if (item.source === "standalone") {
      setHomeworkList((prev) => prev.filter((h) => h.id !== item.id));
    } else {
      setLessons((prev) => prev.map((l) => l.id === item.lessonId ? { ...l, homework: l.homework.filter((h) => h.id !== item.id) } : l));
    }
  }

  if (needAuth) {
    return (
      <AppErrorBoundary>
        <div style={S.shell}>
          <style>{CSS}</style>
          <LoginScreen onDone={afterSignIn} onSkip={() => { setNeedAuth(false); setCloudErr("auth"); if (!offlineBaseRef.current) offlineBaseRef.current = JSON.stringify(stateRef.current); setSyncStatus("error"); }} />
        </div>
      </AppErrorBoundary>
    );
  }

  return (
    <AppErrorBoundary>
    <div style={S.shell}>
      <style>{CSS}</style>
      <div style={S.device}>
        <Header todayCount={lessonsOn(todayStr()).length} bookingEnabled={bookingSettings.enabled} pendingCount={openReqs.length} onOpenBooking={openBookings} />
        <div style={S.banner}>
          {syncStatus === "syncing" && <span>☁️ 同步中…</span>}
          {syncStatus === "synced" && <span>☁️ 已同步雲端，換裝置打開也看得到最新資料</span>}
          {syncStatus === "error" && (
            <span style={{ color: "var(--coral-text)", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              {cloudOk ? "⚠️ 上傳雲端失敗，資料先存在這台裝置，網路恢復後改任何一筆就會再上傳"
                : cloudErr === "auth" ? "🔒 還沒登入，先用這台裝置上的資料（登入後才會同步雲端）"
                : cloudErr === "offline" ? "⚠️ 這台裝置現在沒有網路，先用這台裝置上的資料（暫時不會上傳）"
                : /^http/.test(cloudErr) ? `⚠️ 雲端回應錯誤（${cloudErr.slice(4)}），先用這台裝置上的資料（暫時不會上傳）`
                : "⚠️ 連不到雲端，先用這台裝置上的資料（為了保護雲端資料，暫時不會上傳）"}
              {!cloudOk && <button style={S.retryBtn} onClick={retryCloud}>{cloudErr === "auth" ? "登入" : "重新連線"}</button>}
            </span>
          )}
        </div>

        <div style={S.content}>
          <TabErrorBoundary key={tab + "|" + (moreView || "")}>
          {tab === "schedule" && (
            <ScheduleTab
              calMode={calMode} setCalMode={setCalMode}
              viewMonth={viewMonth} setViewMonth={setViewMonth}
              selectedDate={selectedDate} setSelectedDate={setSelectedDate}
              lessons={lessons} lessonsOn={lessonsOn} studentById={studentById}
              students={students} examRecords={examRecords}
              pendingBookings={openReqs} onOpenBookings={openBookings}
              onAddCourse={(date) => setScheduleForm({ date })}
              onOpenLesson={(l) => setActionSheet(l)}
              onBulkAttend={bulkAttendDay}
              onDayClick={(dateStr, dayLessons) => {
                if (dayLessons.length === 0) setScheduleForm({ date: dateStr });
                else setDayPeek({ date: dateStr, lessons: dayLessons });
              }}
            />
          )}
          {tab === "homework" && (
            <HomeworkTab
              items={homeworkItems} students={students} studentById={studentById}
              onToggleLesson={toggleHomework} onToggleStandalone={toggleStandaloneHomework}
              onAdd={addStandaloneHomework} onDelete={deleteHomeworkItem}
            />
          )}
          {tab === "billing" && (
            <BillingTab
              viewMonth={viewMonth} setViewMonth={setViewMonth}
              breakdown={monthBreakdown} quickBreakdown={quickBreakdown}
              total={monthTotal} pct={settledPct}
              students={students}
              quickTally={quickTally} setQuickTally={setQuickTally}
              activePeriodic={activePeriodic} setActivePeriodic={setActivePeriodic}
              trialRate={trialRate} setTrialRate={setTrialRate}
              scheduledPreview={scheduledPreview} lessons={lessons} fees={fees}
              onSettleAll={() => {
                setSettled((prev) => Array.from(new Set([...prev, ...[...monthBreakdown, ...quickBreakdown].map((b) => b.key)])));
              }}
              onUnsettleAll={() => {
                const keys = new Set([...monthBreakdown, ...quickBreakdown].map((b) => b.key));
                setSettled((prev) => prev.filter((k) => !keys.has(k)));
              }}
              onToggleSettle={(keys) => {
                setSettled((prev) => {
                  const allSettled = keys.every((k) => prev.includes(k));
                  if (allSettled) return prev.filter((k) => !keys.includes(k));
                  return Array.from(new Set([...prev, ...keys]));
                });
              }}
              onAddFee={(fee) => setFees((prev) => [...prev, { ...fee, id: uid(), month: monthKey(viewMonth) }])}
              onDeleteFee={removeFee}
            />
          )}
          {tab === "more" && !moreView && (
            <MoreMenu onSelect={setMoreView} pendingCount={openReqs.length} onBackup={() => downloadBackup(stateRef.current)} />
          )}
          {tab === "more" && moreView && (
            <MoreDetail
              view={moreView} onBack={() => setMoreView(null)}
              students={students} setStudents={setStudents} lessons={lessons} studentById={studentById}
              onEditLesson={(l) => setLogForm(l)} onDeleteLesson={removeLesson}
              weaknessNotes={weaknessNotes} setWeaknessNotes={setWeaknessNotes}
              examRecords={examRecords} setExamRecords={setExamRecords}
              progressList={progressList} setProgressList={setProgressList}
              pointCategories={pointCategories} setPointCategories={setPointCategories}
              pointLogs={pointLogs} setPointLogs={setPointLogs}
              securityProps={{ signedIn, email: AUTH.email, uid: AUTH.uid, onSignOut: signOutNow, onNeedAuth: () => setNeedAuth(true) }}
              bookingProps={{
                settings: bookingSettings, setSettings: setBookingSettings, requests: bookingReqs,
                students, lessons, studentById, cloudOk, fetchStatus: bookingFetch, publishStatus,
                onRefresh: async () => { await fetchBookingRequests(); await publishAvailability(); },
                onAccept: acceptBooking, onDecline: declineBooking, onRemove: removeBooking,
                onResolveCancel: resolveCancelRequest,
              }}
            />
          )}
          </TabErrorBoundary>
        </div>

        <BottomNav
          tab={tab}
          onTab={(t) => { setTab(t); if (t !== "more") setMoreView(null); }}
          onLog={() => setLogForm({})}
        />
      </div>

      {logForm && (
        <LogFormModal
          initial={logForm} students={students} progressList={progressList} setProgressList={setProgressList}
          onClose={() => setLogForm(null)}
          onSave={(lesson) => { upsertLesson(lesson); setLogForm(null); }}
        />
      )}
      {scheduleForm && (
        <ScheduleFormModal
          students={students} initial={scheduleForm}
          onClose={() => setScheduleForm(null)}
          onSave={(newLessons) => { newLessons.forEach(upsertLesson); setScheduleForm(null); }}
        />
      )}
      {actionSheet && (
        <ActionSheet
          lesson={actionSheet} studentById={studentById}
          siblingCount={seriesSiblings(actionSheet).length}
          onClose={() => setActionSheet(null)}
          onAttend={() => { quickAttend(actionSheet); setActionSheet(null); }}
          onAttendWithLog={() => { setLogForm(actionSheet); setActionSheet(null); }}
          onLeave={() => { upsertLesson({ ...actionSheet, status: "leave" }); setActionSheet(null); }}
          onEditTime={() => { setEditTimeLesson(actionSheet); setActionSheet(null); }}
          onDelete={() => { removeLesson(actionSheet.id); setActionSheet(null); }}
          onDeleteSeries={() => { deleteSeries(actionSheet); setActionSheet(null); }}
        />
      )}
      {editTimeLesson && (
        <EditTimeModal
          lesson={editTimeLesson} siblingCount={seriesSiblings(editTimeLesson).length}
          onClose={() => setEditTimeLesson(null)}
          onSave={(l) => { upsertLesson(l); setEditTimeLesson(null); }}
          onSaveSeries={(time, hours) => { applyTimeToSeries(editTimeLesson, time, hours); setEditTimeLesson(null); }}
        />
      )}
      {dayPeek && (
        <DayPeekSheet
          date={dayPeek.date} lessons={dayPeek.lessons} studentById={studentById}
          onClose={() => setDayPeek(null)}
          onPickLesson={(l) => { setActionSheet(l); setDayPeek(null); }}
          onAddCourse={() => { setScheduleForm({ date: dayPeek.date }); setDayPeek(null); }}
        />
      )}
    </div>
    </AppErrorBoundary>
  );
}

class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: "sans-serif", maxWidth: 480, margin: "40px auto" }}>
          <div style={{ color: "#a64330", fontWeight: 700, fontSize: 16, marginBottom: 10 }}>應用程式出了點問題</div>
          <div style={{ color: "#6B7280", fontSize: 13, marginBottom: 10 }}>資料都還在雲端／裝置上，重新整理就會恢復。可以把下面這段訊息回報給開發者：</div>
          <pre style={{ whiteSpace: "pre-wrap", fontSize: 12, background: "#F1ECDF", padding: 12, borderRadius: 6, color: "#2A2A3B" }}>
            {String((this.state.error && this.state.error.message) || this.state.error)}
          </pre>
          <button
            style={{ marginTop: 14, padding: "10px 18px", background: "#232A3B", color: "#fff", border: "none", borderRadius: 6, cursor: "pointer" }}
            onClick={() => window.location.reload()}
          >重新整理頁面</button>
        </div>
      );
    }
    return this.props.children;
  }
}

class TabErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div style={S.card}>
          <div style={{ color: "var(--coral-text)", fontWeight: 600, marginBottom: 8 }}>這個畫面出了點問題</div>
          <div style={S.muted}>資料還在，只是這個畫面顯示不出來。可以把這段訊息回報給開發者：</div>
          <div style={{ ...S.messagePreview, marginTop: 8 }}>{String((this.state.error && this.state.error.message) || this.state.error)}</div>
          <button style={{ ...S.darkBtn, marginTop: 10 }} onClick={() => this.setState({ error: null })}>重新整理這個畫面</button>
        </div>
      );
    }
    return this.props.children;
  }
}

function ScheduleTab({ calMode, setCalMode, viewMonth, setViewMonth, selectedDate, setSelectedDate, lessonsOn, studentById, onAddCourse, onOpenLesson, onBulkAttend, onDayClick, students, examRecords, pendingBookings = [], onOpenBookings }) {
  const [filterStudentId, setFilterStudentId] = useState("");
  const year = viewMonth.getFullYear(), month = viewMonth.getMonth();
  const first = new Date(year, month, 1);
  const startWeekday = (first.getDay() + 6) % 7; // Monday-first: Mon=0 ... Sun=6
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const changeMonth = (delta) => setViewMonth(new Date(year, month + delta, 1));

  function filteredLessonsOn(date) {
    const all = lessonsOn(date);
    return filterStudentId ? all.filter((l) => l.studentId === filterStudentId) : all;
  }
  function examsOn(date) {
    return examRecords.filter((e) => {
      const inRange = date >= e.date && date <= (e.endDate || e.date);
      return inRange && (!filterStudentId || e.studentId === filterStudentId);
    });
  }

  return (
    <div>
      <div style={S.rowBetween}>
        <div style={S.tabToggle}>
          <button style={S.tabBtn(calMode === "day")} onClick={() => setCalMode("day")}>日視圖</button>
          <button style={S.tabBtn(calMode === "month")} onClick={() => setCalMode("month")}>月曆</button>
        </div>
        <select style={S.inputSm} value={filterStudentId} onChange={(e) => setFilterStudentId(e.target.value)}>
          <option value="">全部學生</option>
          {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </div>

      {calMode === "month" ? (
        <div style={S.card}>
          <div style={S.rowBetween}>
            <div style={S.monthTitle}>{year} 年 {month + 1} 月</div>
            <div style={{ display: "flex", gap: 6 }}>
              <button style={S.smallBtn} onClick={() => changeMonth(-1)}><ChevronLeft size={16} /> 上月</button>
              <button style={S.smallBtn} onClick={() => setViewMonth(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1))}>今天</button>
              <button style={S.smallBtn} onClick={() => changeMonth(1)}>下月 <ChevronRight size={16} /></button>
              <button style={S.darkBtn} onClick={() => onAddCourse()}><Plus size={14} /> 新增課</button>
            </div>
          </div>
          <div style={S.gridHead}>
            {WEEKDAYS.map((w) => <div key={w} style={S.gridHeadCell}>{w}</div>)}
          </div>
          <div style={S.grid}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} style={S.dayCellEmpty} />;
              const dateStr = fmt(new Date(year, month, d));
              const dayLessons = filteredLessonsOn(dateStr);
              const dayExams = examsOn(dateStr);
              const holiday = HOLIDAYS[dateStr];
              const isToday = dateStr === todayStr();
              return (
                <div key={i} style={S.dayCell(isToday, !!holiday)} onClick={() => onDayClick(dateStr, dayLessons)}>
                  <div style={S.dayNum(isToday)}>{d}</div>
                  {holiday && <div style={S.holidayLabel}>{holiday}</div>}
                  {dayExams.map((e) => (
                    <div key={e.id} style={S.examMarker}>📝 {studentById(e.studentId)?.name || "學生"} {e.examType}</div>
                  ))}
                  {dayLessons.slice(0, 3).map((l) => (
                    <div key={l.id} style={{ ...S.lessonChip(l.status), cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); onOpenLesson(l); }}>{l.time || ""} {studentById(l.studentId)?.name || "學生"}</div>
                  ))}
                  {dayLessons.length > 3 && <div style={S.moreLabel}>還有 {dayLessons.length - 3} 堂 ›</div>}
                  {!filterStudentId && pendingBookings.filter((r) => r.date === dateStr).map((r) => (
                    <div key={r.id} style={S.pendingChip} onClick={(e) => { e.stopPropagation(); onOpenBookings && onOpenBookings(); }}>⏳ {r.time} {r.name}</div>
                  ))}
                </div>
              );
            })}
          </div>
          <div style={S.legendRow}>
            <span style={S.legendDot("#E7C79A")}></span>已排課
            <span style={{ ...S.legendDot("#9BC1A8"), marginLeft: 14 }}></span>已出席
            <span style={{ ...S.legendDot("#D98E86"), marginLeft: 14 }}></span>請假
            <span style={{ marginLeft: 14 }}>📝 段考</span>
            {pendingBookings.length > 0 && <span style={{ marginLeft: 14 }}>⏳ 待確認預約</span>}
          </div>
        </div>
      ) : (
        <DayView date={selectedDate} setDate={setSelectedDate} lessonsOn={filteredLessonsOn} studentById={studentById} onAddCourse={onAddCourse} onOpenLesson={onOpenLesson} onBulkAttend={onBulkAttend} />
      )}
    </div>
  );
}

function DayView({ date, setDate, lessonsOn, studentById, onAddCourse, onOpenLesson, onBulkAttend }) {
  const dayLessons = lessonsOn(date);
  const pendingCount = dayLessons.filter((l) => l.status === "scheduled").length;
  const d = new Date(date + "T00:00:00");
  const label = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 星期${weekdayLabel(d.getDay())}`;
  return (
    <div style={S.card}>
      <div style={S.rowBetween}>
        <div style={S.monthTitle}>{label}</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          <button style={S.smallBtn} onClick={() => setDate(addDays(date, -1))}><ChevronLeft size={16} /></button>
          <button style={S.smallBtn} onClick={() => setDate(todayStr())}>今天</button>
          <button style={S.smallBtn} onClick={() => setDate(addDays(date, 1))}><ChevronRight size={16} /></button>
          <button style={S.darkBtn} onClick={() => onAddCourse(date)}><Plus size={14} /> 新增課</button>
        </div>
      </div>
      {pendingCount > 0 && (
        <button style={S.bulkAttendBtn} onClick={() => onBulkAttend(dayLessons)}>
          <Check size={14} /> 今天全部出席（{pendingCount} 堂）
        </button>
      )}
      {dayLessons.length === 0 && <div style={S.emptyState}>這天還沒有排課。</div>}
      {dayLessons.map((l) => (
        <div key={l.id} style={S.lessonRow}>
          <div style={S.lessonRowTime}>{l.time || "未定時間"}</div>
          <div style={{ flex: 1, cursor: "pointer" }} onClick={() => onOpenLesson(l)}>
            <div style={{ fontWeight: 500 }}>{studentById(l.studentId)?.name || "未知學生"} · {l.courseType}</div>
            <div style={S.muted}>{l.hours} 小時</div>
          </div>
          {l.status === "scheduled" ? (
            <button style={S.quickAttendChip} onClick={() => onBulkAttend([l])}>✓ 出席</button>
          ) : (
            <span style={S.statusPill(l.status)}>{l.status === "attended" ? "已出席" : "請假"}</span>
          )}
        </div>
      ))}
    </div>
  );
}

function EditTimeModal({ lesson, siblingCount, onClose, onSave, onSaveSeries }) {
  const [date, setDate] = useState(lesson.date);
  const [time, setTime] = useState(lesson.time || "");
  const [hours, setHours] = useState(lesson.hours);
  const [applyToSeries, setApplyToSeries] = useState(false);

  function handleSave() {
    if (applyToSeries && siblingCount > 0) {
      onSaveSeries(time, Number(hours));
    } else {
      onSave({ ...lesson, date, time, hours: Number(hours) });
    }
  }

  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={S.modalSm} onClick={(e) => e.stopPropagation()}>
        <div style={S.modalHead}><span>編輯時間</span><X size={18} style={{ cursor: "pointer" }} onClick={onClose} /></div>
        <label style={S.label}>日期</label>
        <input style={S.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} disabled={applyToSeries} />
        <label style={S.label}>時間</label>
        <TimeSelect value={time} onChange={setTime} />
        <label style={S.label}>時數</label>
        <input style={S.input} type="number" step="0.5" value={hours} onChange={(e) => setHours(e.target.value)} />
        {siblingCount > 0 && (
          <label style={S.checkboxRow}>
            <input type="checkbox" checked={applyToSeries} onChange={(e) => setApplyToSeries(e.target.checked)} />
            套用到這個系列還沒上課的其他 {siblingCount} 堂（只改時間與時數，日期不變）
          </label>
        )}
        <button style={S.saveBtn} onClick={handleSave}>儲存</button>
      </div>
    </div>
  );
}

function ScheduleFormModal({ students, initial, onClose, onSave }) {
  const [studentId, setStudentId] = useState(students[0]?.id || "");
  const [date, setDate] = useState(initial?.date || todayStr());
  const [time, setTime] = useState("16:00");
  const [hours, setHours] = useState(1.5);
  const [courseType, setCourseType] = useState(COURSE_TYPES[0]);
  const [repeatMode, setRepeatMode] = useState("once"); // once | weekly
  const [weeks, setWeeks] = useState(8);

  if (students.length === 0) {
    return (
      <div style={S.overlay} onClick={onClose}>
        <div style={S.modalSm} onClick={(e) => e.stopPropagation()}>
          <div style={S.modalHead}><span>新增課</span><X size={18} style={{ cursor: "pointer" }} onClick={onClose} /></div>
          <div style={S.emptyState}>還沒有學生資料，請先到「更多 → 學生名冊」新增學生。</div>
        </div>
      </div>
    );
  }

  function handleSave() {
    const count = repeatMode === "weekly" ? Math.max(1, Number(weeks || 1)) : 1;
    const seriesId = count > 1 ? uid() : null;
    const list = [];
    for (let i = 0; i < count; i++) {
      list.push({
        id: uid(), studentId, date: addDays(date, i * 7), time, hours: Number(hours),
        courseType, status: "scheduled", materials: [], homework: [], extra: {}, seriesId,
      });
    }
    onSave(list);
  }

  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={S.modalSm} onClick={(e) => e.stopPropagation()}>
        <div style={S.modalHead}><span>新增課</span><X size={18} style={{ cursor: "pointer" }} onClick={onClose} /></div>
        <label style={S.label}>學生</label>
        <select style={S.input} value={studentId} onChange={(e) => setStudentId(e.target.value)}>
          {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <div style={S.twoCol}>
          <div>
            <label style={S.label}>日期</label>
            <input style={S.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
          <div>
            <label style={S.label}>時間</label>
            <TimeSelect value={time} onChange={setTime} />
          </div>
        </div>
        <div style={S.twoCol}>
          <div>
            <label style={S.label}>時數</label>
            <input style={S.input} type="number" step="0.5" value={hours} onChange={(e) => setHours(e.target.value)} />
          </div>
          <div>
            <label style={S.label}>重複</label>
            <select style={S.input} value={repeatMode} onChange={(e) => setRepeatMode(e.target.value)}>
              <option value="once">只有這一天</option>
              <option value="weekly">每週固定</option>
            </select>
          </div>
        </div>
        {repeatMode === "weekly" && (
          <>
            <label style={S.label}>產生幾週（含這週）</label>
            <input style={S.input} type="number" min="1" value={weeks} onChange={(e) => setWeeks(e.target.value)} />
          </>
        )}
        <label style={S.label}>課程類型</label>
        <select style={S.input} value={courseType} onChange={(e) => setCourseType(e.target.value)}>
          {COURSE_TYPES.map((c) => <option key={c}>{c}</option>)}
        </select>
        <div style={S.btnRow}>
          <button style={S.cancelBtnInline} onClick={onClose}>取消</button>
          <button style={S.primaryBtnInline} onClick={handleSave}>新增</button>
        </div>
      </div>
    </div>
  );
}
