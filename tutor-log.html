function HomeworkTab({ items, students, studentById, onToggleLesson, onToggleStandalone, onAdd, onDelete }) {
  const [tab, setTab] = useState("pending");
  const [filterStudent, setFilterStudent] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [newStudentId, setNewStudentId] = useState(students[0]?.id || "");
  const [newText, setNewText] = useState("");
  const [newDue, setNewDue] = useState("");

  const filtered = filterStudent ? items.filter((i) => i.studentId === filterStudent) : items;
  const pending = filtered.filter((i) => !i.done);
  const done = filtered.filter((i) => i.done);
  const list = tab === "pending" ? pending : tab === "done" ? done : filtered;

  function toggle(item) {
    if (item.source === "standalone") onToggleStandalone(item.id);
    else onToggleLesson(item.lessonId, item.id);
  }
  function handleAdd() {
    if (!newText.trim() || !newStudentId) return;
    onAdd(newStudentId, newText.trim(), newDue);
    setNewText(""); setNewDue("");
  }

  function isOverdue(item) {
    return !item.done && item.dueDate && item.dueDate < todayStr();
  }

  return (
    <div style={S.card}>
      <div style={S.rowInputs}>
        <select style={S.inputSm} value={filterStudent} onChange={(e) => setFilterStudent(e.target.value)}>
          <option value="">全部學生</option>
          {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <button style={S.smallBtn} onClick={() => setShowAdd(!showAdd)} disabled={students.length === 0}>{showAdd ? "取消" : "+ 快速新增作業"}</button>
      </div>

      {showAdd && (
        <div style={S.moreBox}>
          <label style={S.label}>學生</label>
          <select style={S.input} value={newStudentId} onChange={(e) => setNewStudentId(e.target.value)}>
            {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          <label style={S.label}>作業內容</label>
          <input style={S.input} placeholder="例：習作 p.20-21" value={newText} onChange={(e) => setNewText(e.target.value)} />
          <label style={S.label}>繳交期限（選填）</label>
          <input style={S.input} type="date" value={newDue} onChange={(e) => setNewDue(e.target.value)} />
          <button style={S.darkBtn} onClick={handleAdd}>+ 加入作業</button>
        </div>
      )}

      <div style={S.tabToggle}>
        <button style={S.tabBtn(tab === "pending")} onClick={() => setTab("pending")}>待追蹤</button>
        <button style={S.tabBtn(tab === "all")} onClick={() => setTab("all")}>全部</button>
        <button style={S.tabBtn(tab === "done")} onClick={() => setTab("done")}>已完成</button>
      </div>
      {list.length === 0 && <div style={S.emptyState}>目前沒有{tab === "pending" ? "待追蹤" : tab === "done" ? "已完成" : ""}的作業。</div>}
      {list.map((i) => (
        <div key={(i.lessonId || "s") + i.id} style={S.hwRow}>
          <input type="checkbox" checked={i.done} onChange={() => toggle(i)} style={{ width: 18, height: 18 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 500 }}>{i.text}</div>
            <div style={S.muted}>
              {studentById(i.studentId)?.name || "學生"} · {i.date}
              {i.dueDate && <span style={isOverdue(i) ? S.overdueTag : S.dueTag}>{isOverdue(i) ? `逾期 ${i.dueDate}` : `期限 ${i.dueDate}`}</span>}
            </div>
          </div>
          <X size={14} style={{ cursor: "pointer", color: "var(--ink-soft)" }} onClick={() => { if (window.confirm("確定要刪除這項作業嗎？")) onDelete(i); }} />
        </div>
      ))}
    </div>
  );
}

function BillingTab({
  viewMonth, setViewMonth, breakdown, quickBreakdown, total, pct, students,
  quickTally, setQuickTally, activePeriodic, setActivePeriodic, trialRate, setTrialRate, scheduledPreview, lessons, fees,
  onSettleAll, onUnsettleAll, onToggleSettle, onAddFee, onDeleteFee,
}) {
  const [previewModal, setPreviewModal] = useState(null); // { title, text }
  const [copiedPreview, setCopiedPreview] = useState(false);
  const monthLabel = `${viewMonth.getMonth() + 1}月`;

  function studentMonthLessons(studentId) {
    const key = monthKey(viewMonth);
    return lessons.filter((l) => l.studentId === studentId && l.date.startsWith(key) && l.status === "attended" && isBillable(l));
  }
  function hoursBreakdownFromQuickCounts(counts) {
    return DURATIONS.map((d, i) => ({ hours: d, count: Number(counts[i] || 0) })).filter((x) => x.count > 0);
  }
  function groupByRate(lns, student) {
    const map = {};
    lns.forEach((l) => {
      const rate = effectiveRate(l, student, trialRate);
      const isTrial = l.courseType === "試聽課";
      const label = isTrial ? "試聽課" : (rate !== Number(student.rate || 0) ? "調整價" : null);
      const key = `${rate}|${label || ""}`;
      if (!map[key]) map[key] = { rate, label, counts: {} };
      const h = Number(l.hours || 0);
      map[key].counts[h] = (map[key].counts[h] || 0) + 1;
    });
    return Object.values(map).map((g) => {
      const items = Object.keys(g.counts).map(Number).sort((a, b) => b - a).map((h) => ({ hours: h, count: g.counts[h] }));
      const days = items.reduce((a, x) => a + x.count, 0);
      const sumHours = items.reduce((a, x) => a + x.hours * x.count, 0);
      return { ...g, items, days, sumHours, fee: sumHours * g.rate };
    }).sort((a, b) => (a.label ? 1 : 0) - (b.label ? 1 : 0));
  }

  function feeItemsFor(studentId) {
    const key = monthKey(viewMonth);
    return fees.filter((f) => f.studentId === studentId && f.month === key);
  }

  function memberBlockLines(b) {
    if (b.student.billingType === "periodic") {
      const lines = [`${monthLabel}課程費用 NT$${b.base.toLocaleString()}`];
      feeItemsFor(b.student.id).forEach((f) => {
        lines.push(`${f.type === "add" ? "+" : "-"} ${f.note || (f.type === "add" ? "加收" : "折扣")} NT$${Number(f.amount).toLocaleString()}`);
      });
      lines.push(`本月總計：NT$${b.total.toLocaleString()}`);
      return lines;
    }
    const lines = [];
    let totalDays;
    if (b.days !== undefined) {
      const bd = hoursBreakdownFromQuickCounts(b.counts);
      bd.forEach((x) => lines.push(`${x.hours} 小時 × ${x.count} 天`));
      totalDays = bd.reduce((a, x) => a + x.count, 0);
    } else {
      const groups = groupByRate(studentMonthLessons(b.student.id), b.student);
      if (groups.length <= 1) {
        (groups[0]?.items || []).forEach((x) => lines.push(`${x.hours} 小時 × ${x.count} 天`));
      } else {
        groups.forEach((g) => {
          if (g.label) lines.push(`【${g.label}】`);
          g.items.forEach((x) => lines.push(`${x.hours} 小時 × ${x.count} 天`));
          lines.push(`小計：${g.sumHours} 小時 × NT$${g.rate} = NT$${g.fee.toLocaleString()}`);
          lines.push("");
        });
      }
      totalDays = groups.reduce((a, g) => a + g.days, 0);
    }
    lines.push(`本月共上 ${totalDays} 天・${b.hours} 小時`);
    const feeItems = feeItemsFor(b.student.id);
    if (feeItems.length > 0) {
      lines.push(`小計：NT$${b.base.toLocaleString()}`);
      feeItems.forEach((f) => {
        lines.push(`${f.type === "add" ? "+" : "-"} ${f.note || (f.type === "add" ? "加收" : "折扣")} NT$${Number(f.amount).toLocaleString()}`);
      });
    }
    lines.push(`本月費用：NT$${b.total.toLocaleString()}`);
    return lines;
  }

  function buildMessage(b) {
    const lines = [`${b.student.name}家長您好：`, `${monthLabel}課程時數：`, ...memberBlockLines(b), `再麻煩請您確認時數，謝謝您~`];
    return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  function buildFamilyMessage(group) {
    const lines = [`${group.household}家長您好：`, `${monthLabel}課程時數：`, ""];
    group.members.forEach((m) => {
      lines.push(`【${m.student.name}】`);
      lines.push(...memberBlockLines(m));
      lines.push("");
    });
    lines.push(`本月合計：NT$${group.total.toLocaleString()}`);
    lines.push(`再麻煩請您確認時數，謝謝您~`);
    return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  function groupRowsByHousehold(rows) {
    const groups = {};
    const singles = [];
    rows.forEach((r) => {
      const h = r.student.household;
      if (h) {
        if (!groups[h]) groups[h] = [];
        groups[h].push(r);
      } else {
        singles.push(r);
      }
    });
    const combined = Object.entries(groups).map(([household, members]) => ({
      household, members,
      total: members.reduce((a, m) => a + m.total, 0),
      isSettled: members.every((m) => m.isSettled),
      key: `household:${household}|${key}`,
    }));
    return { combined, singles };
  }



  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        return true;
      } catch (e2) {
        return false;
      }
    }
  }

  function openPreview(title, text) {
    setPreviewModal({ title, text });
    setCopiedPreview(false);
  }

  async function handleCopyPreview() {
    const ok = await copyText(previewModal.text);
    if (ok) {
      setCopiedPreview(true);
      setTimeout(() => setCopiedPreview(false), 1500);
    }
  }

  function buildLevelOverview() {
    const key = monthKey(viewMonth);
    const lines = [`${monthLabel}份：`];
    let grandTerms = [];
    ["mid", "elem"].forEach((lvl) => {
      const levelStudents = students.filter((s) => s.level === lvl && s.billingType !== "periodic");
      if (levelStudents.length === 0) return;
      const levelLessons = lessons.filter((l) =>
        levelStudents.some((s) => s.id === l.studentId) &&
        l.date.startsWith(key) && l.status === "attended" && isBillable(l)
      );
      if (levelLessons.length === 0) return;
      const hourTerms = levelLessons.map((l) => Number(l.hours || 0));
      const sumHours = hourTerms.reduce((a, h) => a + h, 0);
      const days = new Set(levelLessons.map((l) => l.date)).size;
      const rates = new Set(levelLessons.map((l) => effectiveRate(l, students.find((s) => s.id === l.studentId), trialRate)));
      let fee;
      let calcLine;
      if (rates.size === 1) {
        const rate = [...rates][0];
        fee = sumHours * rate;
        calcLine = `${sumHours}*${rate} = ${fee.toLocaleString()}`;
      } else {
        fee = levelLessons.reduce((a, l) => a + Number(l.hours || 0) * effectiveRate(l, students.find((s) => s.id === l.studentId), trialRate), 0);
        calcLine = `小計 NT$${fee.toLocaleString()}`;
      }
      lines.push(`${LEVELS[lvl]}共${days}天：`);
      lines.push(`時數：${hourTerms.join("+")} = ${sumHours}`);
      lines.push(calcLine);
      lines.push("");
      grandTerms.push(fee);
    });
    if (grandTerms.length > 1) {
      const grandTotal = grandTerms.reduce((a, f) => a + f, 0);
      lines.push(`${grandTerms.map((f) => f.toLocaleString()).join("+")} = ${grandTotal.toLocaleString()}`);
      lines.push("");
    }
    lines.push("再麻煩請您確認時數，謝謝您~");
    return lines.join("\n").trim();
  }

  const [feeStudentId, setFeeStudentId] = useState(students[0]?.id || "");
  const [feeAmount, setFeeAmount] = useState("");
  const [feeNote, setFeeNote] = useState("");
  const [feeType, setFeeType] = useState("add");
  const [expanded, setExpanded] = useState(true);
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [tallyLevel, setTallyLevel] = useState("");
  const [tallyStudentId, setTallyStudentId] = useState("");
  const key = monthKey(viewMonth);

  const periodicStudents = students.filter((s) => s.billingType === "periodic");
  const tallyCandidates = students.filter((s) =>
    s.billingType !== "periodic" &&
    !quickTally[qKey(s.id, key)] &&
    (!tallyLevel || s.level === tallyLevel)
  );

  function updateTallyCount(sid, idx, value) {
    setQuickTally((prev) => {
      const k = qKey(sid, key);
      const counts = [...(prev[k] || emptyCounts())];
      counts[idx] = value;
      return { ...prev, [k]: counts };
    });
  }
  function removeTally(sid) {
    setQuickTally((prev) => {
      const next = { ...prev };
      delete next[qKey(sid, key)];
      return next;
    });
  }
  function clearTallyCounts() {
    if (!window.confirm("確定要清空本月所有快速結算堂數嗎？學生名單會保留，只清空堂數與金額。")) return;
    setQuickTally((prev) => {
      const next = { ...prev };
      Object.keys(next).forEach((k) => { if (k.endsWith("|" + key)) next[k] = emptyCounts(); });
      return next;
    });
  }
  function togglePeriodicActive(sid) {
    const k = qKey(sid, key);
    setActivePeriodic((prev) => prev.includes(k) ? prev.filter((x) => x !== k) : [...prev, k]);
  }

  const forecastTotal = total + scheduledPreview.amount;
  const { combined: familyGroups, singles: singleRows } = groupRowsByHousehold([...breakdown, ...quickBreakdown]);

  return (
    <div>
      <div style={S.rowBetween}>
        <select style={S.monthSelect} value={key} onChange={(e) => {
          const [y, m] = e.target.value.split("-").map(Number);
          setViewMonth(new Date(y, m - 1, 1));
        }}>
          {Array.from({ length: 8 }).map((_, i) => {
            const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - 3 + i, 1);
            const k = monthKey(d);
            return <option key={k} value={k}>{k}</option>;
          })}
        </select>
        <button style={S.darkBtn} onClick={onSettleAll}>一鍵結算本月</button>
      </div>
      <div style={S.rowBetween}>
        <button style={S.linkBtn} onClick={() => { if (window.confirm("確定要把這個月全部取消結算嗎？")) onUnsettleAll(); }}>全部取消結算</button>
      </div>

      <div style={S.incomeCard}>
        <div style={S.twoStatRow}>
          <div>
            <div style={S.muted}>已確認收入</div>
            <div style={S.bigNumber}>NT${total.toLocaleString()}</div>
          </div>
          <div>
            <div style={S.muted}>本月預估總收入</div>
            <div style={S.bigNumberSecondary}>NT${forecastTotal.toLocaleString()}</div>
            {scheduledPreview.count > 0 && <div style={S.hintText}>含 {scheduledPreview.count} 堂已排課、尚未出席</div>}
          </div>
        </div>
        <button style={S.linkBtn} onClick={() => setExpanded(!expanded)}>{expanded ? "▲ 收起明細" : "▼ 查看每位學生明細"}</button>
        {expanded && (
          <div style={{ marginTop: 10 }}>
            {breakdown.length === 0 && quickBreakdown.length === 0 && (
              <div style={S.emptyState}>這個月還沒有課堂紀錄 → 去「排課」或「記一課」新增，或到下面「進階設定」用快速結算直接輸入堂數。</div>
            )}
            {familyGroups.map((g) => (
              <div key={g.key} style={S.billingRow}>
                <div>
                  <div style={{ fontWeight: 500 }}>{g.household}家 <span style={S.quickTag}>合併結算</span></div>
                  {g.members.map((m) => (
                    <div key={m.key} style={S.muted}>{m.student.name}：NT${m.total.toLocaleString()}</div>
                  ))}
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={S.moneyText}>NT${g.total.toLocaleString()}</div>
                  <button style={{ ...(g.isSettled ? S.settledTag : S.unsettledTag), ...S.settleToggleBtn }} onClick={() => onToggleSettle(g.members.map((m) => m.key))}>{g.isSettled ? "已結算" : "未結算"}</button>
                  <button style={S.copyBtn} onClick={() => openPreview("家長通知訊息", buildFamilyMessage(g))}>複製訊息</button>
                </div>
              </div>
            ))}
            {singleRows.map((b) => (
              <div key={b.key} style={S.billingRow}>
                <div>
                  <div style={{ fontWeight: 500 }}>{b.student.name} <LevelTag level={b.student.level} />{b.hasTrial && <span style={S.quickTag}>含試聽課</span>}{b.days !== undefined && <span style={S.quickTag}>快速結算</span>}</div>
                  <div style={S.muted}>
                    {b.student.billingType === "periodic" ? "月結定額" : b.days !== undefined ? `${b.days} 天 · ${b.hours} 小時` : `${b.count} 堂 · ${b.hours} 小時`}
                    {b.add > 0 ? ` · +NT$${b.add}` : ""}{b.disc > 0 ? ` · -NT$${b.disc}` : ""}
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={S.moneyText}>NT${b.total.toLocaleString()}</div>
                  <button style={{ ...(b.isSettled ? S.settledTag : S.unsettledTag), ...S.settleToggleBtn }} onClick={() => onToggleSettle([b.key])}>{b.isSettled ? "已結算" : "未結算"}</button>
                  <button style={S.copyBtn} onClick={() => openPreview("家長通知訊息", buildMessage(b))}>複製訊息</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <button style={S.advancedToggle} onClick={() => setShowAdvanced(!showAdvanced)}>
        {showAdvanced ? "▲ 收起進階設定" : "▼ 進階設定（試聽課費率、月結、快速結算、加費折扣）"}
      </button>

      {showAdvanced && (
        <>
          <div style={S.rowBetween}>
            <button style={S.copyOverviewBtn} onClick={() => openPreview("本月總覽（依年級）", buildLevelOverview())}>
              📋 複製本月總覽（依年級）
            </button>
          </div>

          <div style={S.card}>
            <div style={S.rowInputs}>
              <span style={S.inlineLabel}>試聽課鐘點費</span>
              <input style={S.durInput} type="number" value={trialRate} onChange={(e) => setTrialRate(Number(e.target.value) || 0)} />
              <span style={S.muted}>元 / 小時</span>
            </div>
            <div style={S.muted}>只要課程類型選「試聽課」，結算時就自動用這個價錢，不會用學生原本的鐘點費。</div>
          </div>

          {periodicStudents.length > 0 && (
            <div style={S.card}>
              <div style={S.label}>月結學生（週期定額）</div>
              <div style={S.muted}>有排課紀錄的月結學生會自動列入；沒有逐堂排課的話，點一下標記「本月已上課」即可。</div>
              <div style={S.chipRow}>
                {periodicStudents.map((s) => {
                  const active = activePeriodic.includes(qKey(s.id, key));
                  return (
                    <button key={s.id} style={S.chip(active)} onClick={() => togglePeriodicActive(s.id)}>
                      {s.name}　NT${s.periodicAmount}{active ? " ✓" : ""}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          <div style={S.card}>
            <div style={S.rowBetween}>
              <div style={S.label}>快速結算（免逐堂排課，用天數直接算）</div>
            </div>
            <div style={S.muted}>不想每堂都排課的學生，直接選人、輸入這個月每種時數各上了幾天，鐘點費自動算好。</div>

            {tallyCandidates.length === 0 && Object.keys(quickTally).filter((k) => k.endsWith("|" + key)).length === 0 ? (
              <div style={S.emptyState}>目前沒有可加入的學生，先到「更多 → 學生名冊」新增。</div>
            ) : (
              <div style={S.pickerBox}>
                <div style={S.rowInputs}>
                  <select style={S.inputSm} value={tallyLevel} onChange={(e) => { setTallyLevel(e.target.value); setTallyStudentId(""); }}>
                    <option value="">年級</option>
                    <option value="elem">國小</option>
                    <option value="mid">國中</option>
                  </select>
                  <select style={{ ...S.inputSm, flex: 1 }} value={tallyStudentId} onChange={(e) => setTallyStudentId(e.target.value)} disabled={tallyCandidates.length === 0}>
                    <option value="">{tallyCandidates.length === 0 ? "這個年級沒有可加入的學生" : "選擇學生"}</option>
                    {tallyCandidates.map((s) => <option key={s.id} value={s.id}>{s.name}（{s.rate} 元/hr）</option>)}
                  </select>
                  <button
                    style={S.darkBtn}
                    disabled={!tallyStudentId}
                    onClick={() => {
                      setQuickTally((prev) => ({ ...prev, [qKey(tallyStudentId, key)]: emptyCounts() }));
                      setTallyStudentId("");
                    }}
                  >加入</button>
                </div>
              </div>
            )}

            {quickBreakdown.map((b) => (
              <div key={b.key} style={S.tallyCard}>
                <div style={S.rowBetween}>
                  <div style={{ fontWeight: 500 }}>{b.student.name} <LevelTag level={b.student.level} /></div>
                  <Trash2 size={16} style={{ cursor: "pointer", color: "var(--coral)" }} onClick={() => removeTally(b.student.id)} />
                </div>
                <div style={S.muted}>鐘點費 <span style={S.moneyText}>{b.student.rate}</span> 元 / 小時</div>
                <div style={S.durGrid}>
                  {DURATIONS.map((d, i) => (
                    <div key={d} style={{ textAlign: "center" }}>
                      <div style={S.durLabel}>{d} 小時</div>
                      <input
                        style={S.durInput} type="number" min="0"
                        value={quickTally[qKey(b.student.id, key)][i]}
                        onChange={(e) => updateTallyCount(b.student.id, i, e.target.value)}
                      />
                      <div style={S.durLabel}>天數</div>
                    </div>
                  ))}
                </div>
                <div style={S.rowBetween}>
                  <span style={S.muted}>本月共上 <strong>{b.days}</strong> 天・<strong>{b.hours}</strong> 小時</span>
                  <span style={S.moneyBig}>NT${b.base.toLocaleString()}</span>
                </div>
              </div>
            ))}
            {quickBreakdown.length > 0 && (
              <button style={S.dashedBtn} onClick={clearTallyCounts}>清空本月快速結算堂數</button>
            )}
          </div>

          <div style={S.card}>
            <div style={S.label}>本月其他費用／折扣</div>
            <div style={S.muted}>加收：教材費、講義費、車馬費　·　折扣：介紹費回饋、續約優惠、老客戶折扣</div>
            <div style={S.rowInputs}>
              <button style={S.tabBtn(feeType === "add")} onClick={() => setFeeType("add")}>＋ 加費</button>
              <button style={S.tabBtn(feeType === "discount")} onClick={() => setFeeType("discount")}>－ 折扣</button>
            </div>
            <div style={S.rowInputs}>
              <select style={S.inputSm} value={feeStudentId} onChange={(e) => setFeeStudentId(e.target.value)}>
                {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
              <input style={S.inputSm} placeholder="金額（請輸入正數）" type="number" value={feeAmount} onChange={(e) => setFeeAmount(e.target.value)} />
            </div>
            <input style={S.input} placeholder="說明，例：講義費／介紹費折扣／續約優惠" value={feeNote} onChange={(e) => setFeeNote(e.target.value)} />
            <button style={S.saveBtn} onClick={() => {
              if (!feeAmount || !feeStudentId) return;
              onAddFee({ studentId: feeStudentId, amount: Number(feeAmount), note: feeNote, type: feeType });
              setFeeAmount(""); setFeeNote("");
            }}>+ 加入費用</button>

            {(() => {
              const monthFees = fees.filter((f) => f.month === key);
              if (monthFees.length === 0) return null;
              return (
                <div style={{ marginTop: 14 }}>
                  <div style={S.label}>本月已加入的項目</div>
                  {monthFees.map((f) => {
                    const s = students.find((x) => x.id === f.studentId);
                    return (
                      <div key={f.id} style={S.feeItemRow}>
                        <span>
                          {s?.name || "未知學生"}　
                          <span style={{ color: f.type === "add" ? "var(--coral-text)" : "var(--green-text)" }}>
                            {f.type === "add" ? "+" : "-"}NT${Number(f.amount).toLocaleString()}
                          </span>
                          {f.note ? `　${f.note}` : ""}
                        </span>
                        <X size={14} style={{ cursor: "pointer", color: "var(--ink-soft)" }} onClick={() => onDeleteFee(f.id)} />
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        </>
      )}

      {previewModal && (
        <div style={S.overlay} onClick={() => setPreviewModal(null)}>
          <div style={S.modalSm} onClick={(e) => e.stopPropagation()}>
            <div style={S.modalHead}><span>{previewModal.title}</span><X size={18} style={{ cursor: "pointer" }} onClick={() => setPreviewModal(null)} /></div>
            <div style={S.muted}>訊息內容可以直接修改，改完再複製。</div>
            <textarea
              style={S.messageTextarea}
              rows={10}
              value={previewModal.text}
              onChange={(e) => setPreviewModal({ ...previewModal, text: e.target.value })}
            />
            <div style={{ ...S.btnRow, marginTop: 12 }}>
              <button style={S.cancelBtnInline} onClick={() => setPreviewModal(null)}>關閉</button>
              <button style={S.primaryBtnInline} onClick={handleCopyPreview}>{copiedPreview ? "已複製 ✓" : "複製訊息"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function LessonRecordsPage({ lessons, students, studentById, onEdit, onDelete }) {
  const [filterStudent, setFilterStudent] = useState("");
  const [filterMonth, setFilterMonth] = useState("");
  const [msgFor, setMsgFor] = useState(null);
  const [selected, setSelected] = useState(null);

  const months = Array.from(new Set(lessons.map((l) => l.date.slice(0, 7)))).sort().reverse();
  const records = lessons
    .filter((l) => l.status !== "scheduled")
    .filter((l) => !filterStudent || l.studentId === filterStudent)
    .filter((l) => !filterMonth || l.date.startsWith(filterMonth))
    .sort((a, b) => b.date.localeCompare(a.date));

  function statusLabel(l) {
    if (l.status === "leave") return { text: "請假不計費", style: S.coralTag, tone: "coral" };
    if (l.courseType === "請假（不計費）") return { text: "請假不計費", style: S.coralTag, tone: "coral" };
    if (l.courseType === "試聽課") return { text: "試聽課", style: S.goldTag, tone: "gold" };
    return { text: "已出席", style: S.greenTag, tone: "green" };
  }

  function buildLessonMessage(l) {
    const name = studentById(l.studentId)?.name || "學生";
    const tag = l.status === "leave" || l.courseType === "請假（不計費）" ? "（請假）" : "";
    const content = l.materials?.map((m) => [m.material, m.content].filter(Boolean).join("：")).filter(Boolean).join("\n") || "—";
    const hw = l.homework?.map((h) => h.text).filter(Boolean).join("\n") || "—";
    return `【${name} ${l.date} 課堂紀錄】${tag}\n📘 今天教學內容：\n${content}\n📝 回家作業：\n${hw}`;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        return true;
      } catch (e2) { return false; }
    }
  }

  return (
    <div>
      <div style={S.rowInputs}>
        <select style={S.inputSm} value={filterStudent} onChange={(e) => setFilterStudent(e.target.value)}>
          <option value="">全部學生</option>
          {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <select style={S.inputSm} value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)}>
          <option value="">全部月份</option>
          {months.map((m) => <option key={m} value={m}>{m}</option>)}
        </select>
      </div>

      {records.length === 0 && <div style={S.emptyState}>沒有符合條件的課堂紀錄。</div>}

      <div style={S.recordGrid}>
        {records.map((l) => {
          const s = statusLabel(l);
          const shortDate = l.date.slice(5).replace("-", "/");
          return (
            <button key={l.id} style={S.recordTile(s.tone)} onClick={() => setSelected(l)}>
              <div style={{ fontWeight: 600 }}>{studentById(l.studentId)?.name || "學生"}</div>
              <div style={S.recordTileDate}>{shortDate}</div>
              <div style={S.recordTileTag}>{s.text}</div>
            </button>
          );
        })}
      </div>

      {selected && (() => {
        const l = selected;
        const s = statusLabel(l);
        const content = l.materials?.map((m) => [m.material, m.content].filter(Boolean).join("：")).filter(Boolean).join("；") || "—";
        const hw = l.homework?.map((h) => h.text).filter(Boolean).join("；") || "—";
        return (
          <div style={S.overlay} onClick={() => setSelected(null)}>
            <div style={S.modalSm} onClick={(e) => e.stopPropagation()}>
              <div style={S.modalHead}>
                <span>{studentById(l.studentId)?.name || "學生"} <span style={s.style}>{s.text}</span></span>
                <X size={18} style={{ cursor: "pointer" }} onClick={() => setSelected(null)} />
              </div>
              <div style={S.muted}>{l.date} · {l.status === "leave" || l.courseType === "請假（不計費）" ? 0 : l.hours}hr</div>
              <div style={{ marginTop: 8 }}>教學內容：{content}</div>
              <div>回家作業：{hw}</div>
              <div style={{ ...S.rowInputs, marginTop: 14 }}>
                <button style={S.smallBtn} onClick={() => onEdit(l)}>編輯</button>

function MaterialTrack({ track, onUpdate, onDelete }) {
  const units = track.units || [];
  const [open, setOpen] = useState(false);
  const [newUnit, setNewUnit] = useState("");
  const [pasteText, setPasteText] = useState("");
  const [autoExpand, setAutoExpand] = useState(true);
  const [showPaste, setShowPaste] = useState(false);

  function addUnit() {
    if (!newUnit.trim()) return;
    onUpdate({ units: [...units, { id: uid(), name: newUnit.trim(), done: false }] });
    setNewUnit("");
  }
  function toggleUnit(unitId) {
    onUpdate({ units: units.map((u) => u.id === unitId ? { ...u, done: !u.done } : u) });
  }
  function removeUnit(unitId) {
    onUpdate({ units: units.filter((u) => u.id !== unitId) });
  }
  function bulkAdd() {
    const lines = pasteText.split("\n").map((l) => l.trim()).filter(Boolean);
    const added = [];
    lines.forEach((line) => {
      if (/花路米|^CHAPTER\b/i.test(line)) return; // skip appendix/review sections and chapter-title lines
      const clean = line.replace(/\s*\d+\s*$/, "").trim(); // strip trailing page numbers
      if (!clean) return;
      if (autoExpand) {
        added.push({ id: uid(), name: `${clean} 例題`, done: false });
        added.push({ id: uid(), name: `${clean} 自我評量`, done: false });
      } else {
        added.push({ id: uid(), name: clean, done: false });
      }
    });
    if (added.length) onUpdate({ units: [...units, ...added] });
    setPasteText("");
    setShowPaste(false);
  }

  const doneCount = units.filter((u) => u.done).length;
  const pct = units.length ? Math.round((doneCount / units.length) * 100) : 0;

  return (
    <div style={S.trackCard}>
      <div style={{ ...S.rowBetween, cursor: "pointer", marginBottom: 0 }} onClick={() => setOpen(!open)}>
        <div style={S.rowInputs}>
          <span style={{ fontWeight: 600 }}>{track.material || "（未命名教材）"}</span>
          <span style={S.muted}>{pct}%（{doneCount}/{units.length}）</span>
        </div>
        <span style={S.expandArrow}>{open ? "▲" : "▼"}</span>
      </div>
      {open && (
        <div style={{ marginTop: 10 }}>
          <label style={S.label}>使用教材</label>
          <input style={S.input} placeholder="例：南一國三數學課本" value={track.material} onChange={(e) => onUpdate({ material: e.target.value })} />
          <div style={S.progressTrack}><div style={S.progressFill(pct)} /></div>

          <div style={S.trackUnitList}>
            {units.length === 0 && <div style={{ ...S.emptyState, padding: "12px 0" }}>尚未新增單元</div>}
            {units.map((u) => (
              <div key={u.id} style={S.hwRow}>
                <input type="checkbox" checked={u.done} onChange={() => toggleUnit(u.id)} style={{ width: 18, height: 18 }} />
                <div style={{ flex: 1, textDecoration: u.done ? "line-through" : "none", color: u.done ? "var(--ink-soft)" : "var(--ink)" }}>{u.name}</div>
                <X size={14} style={{ cursor: "pointer", color: "var(--ink-soft)" }} onClick={() => removeUnit(u.id)} />
              </div>
            ))}
          </div>

          <div style={{ ...S.rowInputs, marginTop: 10 }}>
            <input style={{ ...S.input, flex: 1 }} placeholder="新增單元，例：Unit 6 長母音 oa/ow" value={newUnit} onChange={(e) => setNewUnit(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addUnit()} />
            <button style={S.darkBtn} onClick={addUnit}>+ 新增</button>
          </div>

          <button style={S.moreToggle} onClick={() => setShowPaste(!showPaste)}>{showPaste ? "－" : "＋"} 貼上目錄，一次新增多筆</button>
          {showPaste && (
            <div style={S.moreBox}>
              <div style={S.muted}>把課本目錄整段貼進來，一行一個章節，我會自動拆成清單（跳過含「花路米」或「CHAPTER」的行）。</div>
              <textarea style={S.textarea} rows={5} placeholder={"例：\n1-1 連比\n1-2 比例線段\n1-3 相似形"} value={pasteText} onChange={(e) => setPasteText(e.target.value)} />
              <label style={S.checkboxRow}>
                <input type="checkbox" checked={autoExpand} onChange={(e) => setAutoExpand(e.target.checked)} />
                每個章節自動加上「例題」與「自我評量」兩筆
              </label>
              <button style={S.darkBtn} onClick={bulkAdd}>批次新增</button>
            </div>
          )}

          <button style={{ ...S.dashedBtn, marginTop: 10, color: "var(--coral)", borderColor: "var(--coral)" }} onClick={onDelete}>刪除這個教材</button>
        </div>
      )}
    </div>
  );
}

function ProgressPage({ students, progressList, setProgressList }) {

  useEffect(() => {
    const needsFix = progressList.some((t) => !t.id || !t.units);
    if (needsFix) {
      setProgressList((prev) => prev.map((t) => ({ units: [], ...t, id: t.id || uid() })));
    }
  }, []);

  function addTrack() {
    setProgressList((prev) => [...prev, { id: uid(), studentId, material: "", units: [] }]);
  }
  function updateTrackById(id, patch) {
    setProgressList((prev) => prev.map((t) => t.id === id ? { ...t, ...patch } : t));
  }
  function deleteTrack(id) {
    if (!window.confirm("確定要刪除這個教材的進度紀錄嗎？")) return;
    setProgressList((prev) => prev.filter((t) => t.id !== id));
  }

  const tracks = progressList
    .filter((t) => t.studentId === studentId)
    .map((t) => ({ id: t.id || `${t.studentId}-legacy-${t.material || ""}`, units: [], ...t }));

  if (students.length === 0) return <div style={S.emptyState}>還沒有學生，先到「學生名冊」新增。</div>;

  return (

      {tracks.length === 0 && <div style={{ ...S.emptyState, padding: "20px 0" }}>這位學生還沒有教材，點上面新增一本開始追蹤進度</div>}

        <MaterialTrack key={t.id} track={t} onUpdate={(patch) => updateTrackById(t.id, patch)} onDelete={() => deleteTrack(t.id)} />

  );
}

const EXAM_TYPES = ["小考", "段考", "模考", "其他"];

function ExamsPage({ students, examRecords, setExamRecords }) {
  const [studentId, setStudentId] = useState(students[0]?.id || "");
  const [date, setDate] = useState(todayStr());
  const [endDate, setEndDate] = useState("");
  const [examType, setExamType] = useState(EXAM_TYPES[0]);
  const [examName, setExamName] = useState("");
  const [score, setScore] = useState("");
  const [maxScore, setMaxScore] = useState(100);
  const [content, setContent] = useState("");
  const [editingId, setEditingId] = useState(null);
  const records = examRecords.filter((r) => r.studentId === studentId).sort((a, b) => b.date.localeCompare(a.date));

  function resetForm() {
    setEditingId(null); setDate(todayStr()); setEndDate(""); setExamType(EXAM_TYPES[0]);
    setExamName(""); setScore(""); setMaxScore(100); setContent("");
  }
  function startEdit(r) {
    setEditingId(r.id);
    setDate(r.date); setEndDate(r.endDate || ""); setExamType(r.examType); setExamName(r.examName);
    setScore(r.score == null ? "" : String(r.score)); setMaxScore(r.maxScore); setContent(r.content || "");
  }
  function saveRecord() {
    if (!examName.trim()) return;
    const payload = {
      studentId, date, endDate: endDate && endDate > date ? endDate : "", examType, examName: examName.trim(),
      score: score === "" ? null : Number(score), maxScore: Number(maxScore || 100), content: content.trim(),
    };
    if (editingId) {
      setExamRecords((prev) => prev.map((r) => r.id === editingId ? { ...r, ...payload } : r));
    } else {
      setExamRecords((prev) => [...prev, { id: uid(), ...payload }]);
    }
    resetForm();
  }
  function removeRecord(id) {
    setExamRecords((prev) => prev.filter((r) => r.id !== id));
    if (editingId === id) resetForm();
  }

  if (students.length === 0) return <div style={S.emptyState}>還沒有學生，先到「學生名冊」新增。</div>;

  return (
    <div>
      <div style={S.label}>選擇學生</div>
      <select style={S.input} value={studentId} onChange={(e) => { setStudentId(e.target.value); resetForm(); }}>
        {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
      </select>
      <div style={S.progressBox}>
        <div style={S.label}>{editingId ? "編輯考試" : "新增考試（可以先只填日期，成績之後再補）"}</div>
        <div style={S.twoCol}>
          <div>
            <label style={S.label}>日期</label>
            <input style={S.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
          <div>
            <label style={S.label}>考到第幾天（選填，段考/模考常常不只一天）</label>
            <input style={S.input} type="date" value={endDate} min={date} onChange={(e) => setEndDate(e.target.value)} />
          </div>
        </div>
        <label style={S.label}>考試類型</label>
        <select style={S.input} value={examType} onChange={(e) => setExamType(e.target.value)}>
          {EXAM_TYPES.map((t) => <option key={t}>{t}</option>)}
        </select>
        <label style={S.label}>考試名稱</label>
        <input style={S.input} placeholder="例：Unit 5 小考、3 月模考" value={examName} onChange={(e) => setExamName(e.target.value)} />
        <div style={S.twoCol}>
          <div>
            <label style={S.label}>得分（選填，考完再回來補）</label>
            <input style={S.input} type="number" value={score} onChange={(e) => setScore(e.target.value)} />
          </div>
          <div>
            <label style={S.label}>滿分</label>
            <input style={S.input} type="number" value={maxScore} onChange={(e) => setMaxScore(e.target.value)} />
          </div>

// Tap or drag across cells to paint availability. value: { colKey: ["HH:MM", ...] }
function SlotGrid({ cols, value, onPaint, compact }) {
  const mode = useRef(null);
  const rows = [];
  for (let m = GRID_START; m < GRID_END; m += SLOT) rows.push(m);

  function cellAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const c = el && el.getAttribute && el.getAttribute("data-cell");
    return c ? c.split("|") : null;
  }
  function begin(e, colKey, time) {
    const on = (value[colKey] || []).includes(time);
    mode.current = !on;
    onPaint(colKey, time, mode.current);
    if (e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} }
  }
  function move(e) {
    if (mode.current === null) return;
    const c = cellAt(e.clientX, e.clientY);
    if (c) onPaint(c[0], c[1], mode.current);
  }

  return (
    <div
      style={S.slotGridWrap}
      onPointerMove={move}
      onPointerUp={() => { mode.current = null; }}
      onPointerLeave={() => { mode.current = null; }}
      onPointerCancel={() => { mode.current = null; }}
    >
      <div style={S.slotGrid(cols.length)}>
        <div />
        {cols.map((c) => <div key={c.key} style={S.slotHead(c.jsDay === 0 || c.jsDay === 6)}>{c.label}</div>)}
        {rows.map((m) => {
          const hour = m % 60 === 0;
          return (
            <React.Fragment key={m}>
              <div style={S.slotTime(hour)}>{hour ? toTime(m) : ""}</div>
              {cols.map((c) => {
                const t = toTime(m);
                const on = (value[c.key] || []).includes(t);
                return (
                  <div
                    key={c.key + t}
                    data-cell={c.key + "|" + t}
                    style={S.slotCell(on, hour, compact)}
                    onPointerDown={(e) => { e.preventDefault(); begin(e, c.key, t); }}
                  />
                );
              })}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

function OverrideCalendar({ bs, setSettings, lessons }) {
  const [vm, setVm] = useState(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const [picked, setPicked] = useState(null);
  const [editing, setEditing] = useState(false);
  const year = vm.getFullYear(), month = vm.getMonth();
  const startWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const ov = (date) => (bs.overrides || {})[date];
  function setOverride(date, val) {
    setSettings((prev) => {
      const next = { ...(prev.overrides || {}) };
      if (val === null) delete next[date]; else next[date] = val;
      return { ...prev, overrides: next };
    });
  }
  function paintCustom(date, _col, time, add) {
    setSettings((prev) => {
      const cur = (prev.overrides || {})[date];
      const base = cur && cur.slots ? cur.slots : (cur && cur.blocked ? [] : daySlots(prev, date));
      const set = new Set(base);
      if (add) set.add(time); else set.delete(time);
      return { ...prev, overrides: { ...(prev.overrides || {}), [date]: { slots: Array.from(set).sort() } } };
    });
  }

  const info = picked ? (() => {
    const o = ov(picked);
    const dayLessons = lessons.filter((l) => l.date === picked && occupies(l));
    return { o, dayLessons, slots: daySlots(bs, picked) };
  })() : null;

  return (
    <div>
      <div style={S.rowBetween}>
        <div style={S.monthTitle}>{year} 年 {month + 1} 月</div>
        <div style={{ display: "flex", gap: 6 }}>
          <button style={S.smallBtn} onClick={() => { setVm(new Date(year, month - 1, 1)); setPicked(null); }}><ChevronLeft size={16} /></button>
          <button style={S.smallBtn} onClick={() => { setVm(new Date(year, month + 1, 1)); setPicked(null); }}><ChevronRight size={16} /></button>
        </div>
      </div>
      <div style={S.ovHead}>{WEEKDAYS.map((w) => <div key={w} style={S.gridHeadCell}>{w}</div>)}</div>
      <div style={S.ovGrid}>
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const date = fmt(new Date(year, month, d));
          const o = ov(date);
          const n = daySlots(bs, date).length;
          const past = date < todayStr();
          return (
            <button key={i} style={S.ovCell(date === picked, date === todayStr(), past)} onClick={() => { setPicked(date); setEditing(false); }}>
              <span>{d}</span>
              <span style={S.ovDot(o && o.blocked ? "coral" : o && o.slots ? "gold" : n > 0 ? "green" : "none")} />
            </button>
          );
        })}
      </div>
      <div style={S.legendRow}>
        <span style={S.legendDot("#33714A")}></span>有時段
        <span style={{ ...S.legendDot("#C1533B"), marginLeft: 12 }}></span>已封鎖
        <span style={{ ...S.legendDot("#C98A2B"), marginLeft: 12 }}></span>自訂時段
      </div>

      {!picked && <div style={S.emptyState}>點上面的日期，可以針對那一天封鎖或改時段</div>}
      {picked && (
        <div style={S.ovPanel}>
          <div style={S.rowBetween}>
            <div style={{ fontWeight: 700 }}>{dateLabel(picked)}</div>
            <X size={16} style={{ cursor: "pointer", color: "var(--ink-soft)" }} onClick={() => setPicked(null)} />
          </div>
          <div style={S.muted}>
            {info.o && info.o.blocked ? "🚫 這天已封鎖，不開放預約"
              : info.o && info.o.slots ? `✏️ 自訂時段：${info.slots.length ? info.slots.length / 2 + " 小時" : "沒有時段"}`
              : bs.skipHolidays && HOLIDAYS[picked] ? `🎌 ${HOLIDAYS[picked]}，依設定不開放`
              : info.slots.length ? `依週模板：${info.slots.length / 2} 小時（${info.slots[0]} 起）` : "週模板這天沒有設定時段"}
          </div>
          {info.dayLessons.length > 0 && <div style={S.hintText}>這天已經有 {info.dayLessons.length} 堂課，那些時間本來就不會開放</div>}
          {!editing ? (
            <div style={{ ...S.rowInputs, marginTop: 10 }}>
              {!(info.o && info.o.blocked) && <button style={S.blockBtn} onClick={() => setOverride(picked, { blocked: true })}>🚫 封鎖整天</button>}
              <button style={S.darkBtn} onClick={() => setEditing(true)}>🕑 自訂時段</button>
              {info.o && <button style={S.smallBtn} onClick={() => { setOverride(picked, null); setEditing(false); }}>恢復週模板</button>}
            </div>
          ) : (
            <div style={{ marginTop: 8 }}>
              <div style={S.muted}>點格子選這一天要開放的時間（只影響這天）</div>
              <SlotGrid
                cols={[{ key: picked, jsDay: new Date(picked + "T00:00:00").getDay(), label: dateLabel(picked) }]}
                value={{ [picked]: daySlots(bs, picked) }}
                onPaint={(col, time, add) => paintCustom(picked, col, time, add)}
              />
              <button style={S.darkBtn} onClick={() => setEditing(false)}>完成</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function BookingPage({ settings, setSettings, requests, students, lessons, studentById, cloudOk, fetchStatus, publishStatus, onRefresh, onAccept, onDecline, onRemove, onResolveCancel }) {

  const [refreshing, setRefreshing] = useState(false);
  const open = requests.filter(needsAction).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const done = requests.filter((r) => !needsAction(r));
  const set = (patch) => setSettings((prev) => ({ ...prev, ...patch }));
  const link = bookingLink(bs);
  const hrs = weekHours(bs.weekly);

  // Handled requests keep no name in the shared database, so read it back from
  // the lesson it created instead.
  function reqName(r) {
    if (r.name) return r.name;
    const l = r.teacherLessonId && lessons.find((x) => x.id === r.teacherLessonId);
    const s = l && studentById(l.studentId);
    return s ? s.name : "（已處理，詳情看課表）";
  }
  function paintWeek(colKey, time, add) {
    setSettings((prev) => {
      const cur = (prev.weekly || {})[colKey] || [];
      if (add === cur.includes(time)) return prev;
      const next = add ? [...cur, time].sort() : cur.filter((t) => t !== time);
      return { ...prev, weekly: { ...(prev.weekly || {}), [colKey]: next } };
    });
  }
  function preset(kind) {
    setSettings((prev) => {
      const w = { ...(prev.weekly || {}) };
      if (kind === "clear") { WEEK_COLS.forEach((c) => { w[c.key] = []; }); }
      if (kind === "weeknight") [1, 2, 3, 4, 5].forEach((d) => { w["w" + d] = Array.from(new Set([...(w["w" + d] || []), ...rangeSlots("17:00", "21:00")])).sort(); });
      if (kind === "weekend") [6, 0].forEach((d) => { w["w" + d] = Array.from(new Set([...(w["w" + d] || []), ...rangeSlots("09:00", "17:00")])).sort(); });
      return { ...prev, weekly: w };
    });
  }
  async function copy(text, tag) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) {}
      document.body.removeChild(ta);
    }
    setCopied(tag); setTimeout(() => setCopied(""), 1500);
  }
  function confirmMessage(r) {
    const end = toTime(toMin(r.time) + Number(r.hours || 0) * 60);
    const where = bs.mode === "online" ? `\n上課方式：線上（${bs.onlineTool || "視訊"}）${bs.meetLink ? "\n連結：" + bs.meetLink : ""}` : "";

    return `${nm}家長您好：\n已幫${nm}安排 ${dateLabel(r.date)} ${r.time}–${end} 的課（${r.hours} 小時）${where}\n到時候見，謝謝您～`;
  }
  const statusText = { accepted: "已排課", declined: "已婉拒", cancelled: "學生已取消" };

  return (
    <div>
      <div style={S.tabToggle}>
        <button style={S.tabBtn(page === "inbox")} onClick={() => setPage("inbox")}>預約申請{open.length > 0 ? `（${open.length}）` : ""}</button>

          <div style={S.rowBetween}>

function LoginScreen({ onDone, onSkip }) {
  const [email, setEmail] = useState(() => { const a = authRead(); return (a && a.email) || ""; });
  const [password, setPassword] = useState("");
  const [apiKey, setApiKey] = useState(authApiKey());
  const [showKey, setShowKey] = useState(!authApiKey());
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit() {
    setErr(""); setBusy(true);
    if (apiKey.trim() && apiKey.trim() !== authApiKey()) authSaveApiKey(apiKey.trim());
    const res = await authSignIn(email.trim(), password);
    setBusy(false);
    if (!res.ok) { setErr(res.msg); return; }
    onDone();
  }

  return (
    <div style={S.loginWrap}>
      <div style={S.loginCard}>
        <div style={S.brand}>課跡 <span style={S.brandAccent}>Kèjì</span></div>
        <div style={{ ...S.muted, marginBottom: 14 }}>資料庫需要登入才能讀取</div>
        <label style={S.label}>電子郵件</label>
        <input style={S.input} type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} />
        <label style={S.label}>密碼</label>
        <input style={S.input} type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} />
        {!showKey && <button style={S.moreToggle} onClick={() => setShowKey(true)}>＋ 網頁 API 金鑰設定</button>}
        {showKey && (
          <>
            <label style={S.label}>網頁 API 金鑰（Firebase 主控台 → 專案設定 → 一般）</label>
            <input style={S.input} value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="AIza..." />
            <div style={S.hintText}>只會存在這台裝置，填一次就好。</div>
          </>
        )}
        {err && <div style={S.warnBox}>{err}</div>}
        <button style={{ ...S.saveBtn, opacity: busy ? 0.6 : 1 }} disabled={busy} onClick={submit}>{busy ? "登入中…" : "登入"}</button>
        <button style={S.linkBtnWide} onClick={onSkip}>先不要登入，只看這台裝置上的資料</button>
        <div style={S.hintText}>不登入的話可以照常使用，但不會同步雲端，也不會動到雲端上的資料。</div>
      </div>
    </div>
  );
}

function SecurityPage({ signedIn, email, uid, onSignOut, onNeedAuth }) {
  const [copied, setCopied] = useState("");
  async function copy(text, tag) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) {}
      document.body.removeChild(ta);
    }
    setCopied(tag); setTimeout(() => setCopied(""), 1500);
  }
  const u = uid || "你的_UID";
  const rules = `"tutor_log": {\n  ".read": "auth.uid === '${u}'",\n  ".write": "auth.uid === '${u}'"\n},\n"${BOOKING_PATH}": {\n  "public": { ".read": true, ".write": "auth.uid === '${u}'" },\n  "holds":  { ".read": true, "$hid": { ".write": true } },\n  "requests": {\n    ".read": "auth.uid === '${u}'",\n    ".write": "auth.uid === '${u}'",\n    "$id": { ".read": true, ".write": true }\n  }\n}`;

  return (
    <div>
      <div style={S.secCard}>
        <div style={S.secTitle}>登入狀態</div>
        {signedIn ? (
          <>
            <div style={{ marginTop: 6 }}>✅ 已登入：<b>{email}</b></div>
            <div style={S.muted}>這台裝置會記住登入，不用每次重打。</div>
            <div style={{ ...S.label, marginTop: 12 }}>你的 UID（貼到資料庫規則用）</div>
            <div style={S.codeBox}>{uid}</div>
            <button style={S.darkBtn} onClick={() => copy(uid, "uid")}>{copied === "uid" ? "已複製 ✓" : "複製 UID"}</button>
            <button style={{ ...S.dashedBtn, marginTop: 14, color: "var(--coral)", borderColor: "var(--coral)" }} onClick={() => { if (window.confirm("登出後要重新輸入密碼才能同步雲端。確定嗎？")) onSignOut(); }}>登出</button>
          </>
        ) : (
          <>
            <div style={{ marginTop: 6 }}>目前沒有登入。資料庫規則還沒要求登入的話，照常可以用。</div>
            <button style={{ ...S.darkBtn, marginTop: 10 }} onClick={onNeedAuth}>現在登入</button>
          </>
        )}
      </div>

      <div style={S.secCard}>
        <div style={S.secTitle}>把資料庫鎖起來</div>
        <div style={S.muted}>照順序做，中間不會有資料讀不到的空窗。</div>
        <div style={S.stepRow}><b>1.</b> Firebase →「Authentication → Sign-in method」→ 啟用「電子郵件／密碼」</div>
        <div style={S.stepRow}><b>2.</b>「Users → 新增使用者」填一組信箱密碼（這就是你以後的登入帳號）</div>
        <div style={S.stepRow}><b>3.</b> 回到這個頁面登入，確認上面有出現你的 UID</div>
        <div style={S.stepRow}><b>4.</b> Firebase →「Realtime Database → 規則」，把 tutor_log 和 {BOOKING_PATH} 這兩段換成下面這個，按「發布」</div>
        {!signedIn && <div style={S.warnBox}>先登入，下面才會帶入你的 UID。現在複製的話要自己換掉 你的_UID。</div>}
        <div style={{ ...S.codeBox, whiteSpace: "pre-wrap" }}>{rules}</div>
        <button style={S.darkBtn} onClick={() => copy(rules, "rules")}>{copied === "rules" ? "已複製 ✓" : "複製規則"}</button>
        <div style={S.infoBox}>
          改完之後：<br />
          · tutor_log（學生、學費、所有紀錄）只有登入的你讀得到、寫得到<br />
          · 學生看得到空檔、送得出預約，但看不到別人的預約清單<br />
          · 學生仍然讀得到自己那一筆的狀態（網址裡的那組亂碼 ID 只有他自己有）<br />
          · 其他頁面（s1_mathplan 那些）不受影響，規則不用動
        </div>
        <div style={S.hintText}>萬一密碼忘了：Firebase 主控台 → Authentication → 該使用者 → 重設密碼。</div>
      </div>
    </div>
  );
}

const CSS = `
:root {
  --paper: #F7F3E8;
  --card: #FBF9F2;
  --desk: #232A3B;
  --ink: #232A3B;
  --ink-soft: #6B7280;
  --line: #DED5C0;
  --teal: #2F6F62;
  --coral: #C1533B;
  --gold: #C98A2B;
  --banner-bg: #EFE9D8;
  --empty-cell: #F1ECDF;
  --holiday-bg: #F7ECEA;
  --incomeCard: #FBF9F2;
  --green-bg: #E1EDE3; --green-text: #33714A;
  --coral-bg: #F3DEDA; --coral-text: #A64330;
  --gold-bg: #F1E1BE; --gold-text: #96690F;
  --elem-bg: #E1EDE3; --elem-text: #2A7D5F;
  --mid-bg: #EDE3F5; --mid-text: #6B4894;
  --font-serif: Georgia, 'Noto Serif TC', serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
