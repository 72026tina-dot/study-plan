<script type="text/plain" id="app-source">

const { useState, useEffect, useMemo } = React;

function makeIcon(symbol) {
  return function IconComp({ size = 16, style, ...rest }) {
    return React.createElement(
      "span",
      { style: { fontSize: size, lineHeight: 1, display: "inline-block", ...style }, ...rest },
      symbol
    );
  };
}
const Calendar = makeIcon("\uD83D\uDCC5");
const CheckSquare = makeIcon("\u2705");
const Wallet = makeIcon("\uD83D\uDCB0");
const Menu = makeIcon("\u2630");
const Plus = makeIcon("\uFF0B");
const X = makeIcon("\u2715");
const ChevronLeft = makeIcon("\u2039");
const ChevronRight = makeIcon("\u203A");
const Trash2 = makeIcon("\uD83D\uDDD1");
const Star = makeIcon("\u2B50");
const Target = makeIcon("\uD83C\uDFAF");
const Users = makeIcon("\uD83D\uDC65");
const Sprout = makeIcon("\uD83C\uDF31");
const ArrowLeft = makeIcon("\u2190");
const Check = makeIcon("\u2713");
const ClipboardList = makeIcon("\uD83D\uDCCB");
const FileText = makeIcon("\uD83D\uDCC4");
const TrendingUp = makeIcon("\uD83D\uDCC8");
const Pencil = makeIcon("\u270F\uFE0F");
const UserPlus = makeIcon("\u2795");


const TEACHER_NAME = "老師";
const TODAY = new Date(); // always reflects the real device date
const HOLIDAYS = {
  "2026-01-01": "元旦",
  "2026-02-15": "小年夜",
  "2026-02-16": "除夕",
  "2026-02-17": "春節",
  "2026-02-18": "春節",
  "2026-02-19": "春節",
  "2026-02-20": "小年夜補假",
  "2026-02-27": "228補假",
  "2026-02-28": "和平紀念日",
  "2026-04-04": "兒童節",
  "2026-04-05": "清明節",
  "2026-05-01": "勞動節",
  "2026-06-19": "端午節",
  "2026-09-25": "中秋節",
  "2026-09-28": "教師節",
  "2026-10-10": "國慶日",
  "2026-10-25": "台灣光復節",
  "2026-12-25": "行憲紀念日",
};
const COURSE_TYPES = ["正常上課", "試聽課", "補課", "請假（不計費）", "其他"];
const WEEKDAYS = ["一", "二", "三", "四", "五", "六", "日"]; // Monday-first order for column headers
function weekdayLabel(jsDay) { return WEEKDAYS[(jsDay + 6) % 7]; } // jsDay: 0=Sun..6=Sat
const DURATIONS = [3, 2.5, 2, 1.5, 1, 0.5];
const LEVELS = { elem: "國小", mid: "國中" };
const DEFAULT_POINT_CATEGORIES = [
  { id: "focus", emoji: "🎯", label: "專心上課", value: 2 },
  { id: "speak", emoji: "🙋", label: "主動發言", value: 2 },
  { id: "hw", emoji: "✅", label: "按時完成作業", value: 3 },
  { id: "progress", emoji: "📈", label: "今日有進步", value: 2 },
  { id: "manner", emoji: "😊", label: "禮貌／態度佳", value: 1 },
  { id: "distract", emoji: "💤", label: "分心／不專心", value: -2 },
  { id: "forget", emoji: "📕", label: "忘記帶課本/作業", value: -2 },
];
function isBillable(lesson) { return lesson.courseType !== "請假（不計費）"; }
function effectiveRate(lesson, student, trialRate) {
  if (lesson.rateOverride !== undefined && lesson.rateOverride !== null && lesson.rateOverride !== "") return Number(lesson.rateOverride);
  if (lesson.courseType === "試聽課") return Number(trialRate || 0);
  return Number(student?.rate || 0);
}

function pad(n) { return String(n).padStart(2, "0"); }
function fmt(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayStr() { return fmt(TODAY); }
function monthKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return fmt(d);
}
function qKey(studentId, month) { return `${studentId}|${month}`; }
function emptyCounts() { return [0, 0, 0, 0, 0, 0]; }
function calcQuick(counts, rate) {
  let hours = 0, days = 0;
  DURATIONS.forEach((d, i) => {
    const c = parseFloat(counts[i]) || 0;
    hours += d * c; days += c;
  });
  const fee = Math.round(hours * (parseFloat(rate) || 0));
  return { days: Math.round(days * 10) / 10, hours: Math.round(hours * 10) / 10, fee };
}

const SEED_STUDENTS = [
  { id: "s1", name: "陳小美", rate: 700, level: "mid", billingType: "hourly", periodicAmount: 0, note: "國三數學" },
  { id: "s2", name: "林大文", rate: 600, level: "elem", billingType: "periodic", periodicAmount: 6000, note: "小六英文，月結" },
];
const SEED_LESSONS = [
  {
    id: "l1", studentId: "s1", date: todayStr(), time: "16:00", hours: 1,
    courseType: "正常上課", status: "attended",
    materials: [{ id: uid(), material: "康軒數學 三下", content: "第四章 一元一次方程式" }],
    homework: [{ id: uid(), text: "習作 p.20-21", done: false }],
    extra: { learningStatus: "上課專注，計算偶有粗心", examScore: "", points: 3, weakness: "分數通分容易算錯" },
  },
];

async function loadKey(key, fallback) {
  try {
    const v = localStorage.getItem("kejizhu_" + key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveKey(key, value) {
  try { localStorage.setItem("kejizhu_" + key, JSON.stringify(value)); } catch (e) {}
}

// Cloud sync — uses the same Firebase Realtime Database as the old tutor-fees
// tool, but under its own "tutor_log" path so it never overwrites that data.
const FB_URL = "https://math-plan-default-rtdb.asia-southeast1.firebasedatabase.app/tutor_log.json";
async function cloudLoad() {
  try {
    const r = await fetch(FB_URL);
    if (!r.ok) return null;
    const j = await r.json();
    return j && typeof j === "object" ? j : null;
  } catch (e) {
    return null;
  }
}
async function cloudSave(state) {
  try {
    await fetch(FB_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
    return true;
  } catch (e) {
    return false;
  }
}

function App() {
  const [ready, setReady] = useState(false);
  const [students, setStudents] = useState(SEED_STUDENTS);
  const [lessons, setLessons] = useState(SEED_LESSONS);
  const [fees, setFees] = useState([]);
  const [settled, setSettled] = useState([]);
  const [quickTally, setQuickTally] = useState({});
  const [activePeriodic, setActivePeriodic] = useState([]);
  const [trialRate, setTrialRate] = useState(250);
  const [weaknessNotes, setWeaknessNotes] = useState([]);
  const [examRecords, setExamRecords] = useState([]);
  const [progressList, setProgressList] = useState([]);
  const [pointCategories, setPointCategories] = useState(DEFAULT_POINT_CATEGORIES);
  const [pointLogs, setPointLogs] = useState([]);
  const [homeworkList, setHomeworkList] = useState([]);
  const [syncStatus, setSyncStatus] = useState("syncing"); // syncing | synced | error

  const [tab, setTab] = useState("schedule");
  const [calMode, setCalMode] = useState("month");
  const [viewMonth, setViewMonth] = useState(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [moreView, setMoreView] = useState(null);

  const [logForm, setLogForm] = useState(null);
  const [scheduleForm, setScheduleForm] = useState(null);
  const [actionSheet, setActionSheet] = useState(null);
  const [editTimeLesson, setEditTimeLesson] = useState(null);
  const [dayPeek, setDayPeek] = useState(null); // { date, lessons }

  useEffect(() => {
    (async () => {
      const cloud = await cloudLoad();
      if (cloud) {
        setStudents(cloud.students || SEED_STUDENTS);
        setLessons(cloud.lessons || SEED_LESSONS);
        setFees(cloud.fees || []);
        setSettled(cloud.settled || []);
        setQuickTally(cloud.quickTally || {});
        setActivePeriodic(cloud.activePeriodic || []);
        setTrialRate(cloud.trialRate ?? 250);
        setWeaknessNotes(cloud.weaknessNotes || []);
        setExamRecords(cloud.examRecords || []);
        setProgressList(cloud.progressList || []);
        setPointCategories(cloud.pointCategories || DEFAULT_POINT_CATEGORIES);
        setPointLogs(cloud.pointLogs || []);
        setHomeworkList(cloud.homeworkList || []);
        setSyncStatus("synced");
      } else {
        // Cloud unreachable — fall back to this device's local copy so work isn't lost.
        const s = await loadKey("students", null);
        const l = await loadKey("lessons", null);
        const f = await loadKey("fees", null);
        const st = await loadKey("settled", null);
        const qt = await loadKey("quickTally", null);
        const ap = await loadKey("activePeriodic", null);
        const tr = await loadKey("trialRate", null);
        const wn = await loadKey("weaknessNotes", null);
        const er = await loadKey("examRecords", null);
        const pl = await loadKey("progressList", null);
        const pc = await loadKey("pointCategories", null);
        const pg = await loadKey("pointLogs", null);
        const hl = await loadKey("homeworkList", null);
        if (s) setStudents(s);
        if (l) setLessons(l);
        if (f) setFees(f);
        if (st) setSettled(st);
        if (qt) setQuickTally(qt);
        if (ap) setActivePeriodic(ap);
        if (tr != null) setTrialRate(tr);
        if (wn) setWeaknessNotes(wn);
        if (er) setExamRecords(er);
        if (pl) setProgressList(pl);
        if (pc) setPointCategories(pc);
        if (pg) setPointLogs(pg);
        if (hl) setHomeworkList(hl);
        setSyncStatus("error");
      }
      setReady(true);
    })();
  }, []);

  // Debounced write-through: every change gets mirrored to local storage
  // immediately, and to the shared cloud database shortly after.
  useEffect(() => {
    if (!ready) return;
    const state = {
      students, lessons, fees, settled, quickTally, activePeriodic, trialRate,
      weaknessNotes, examRecords, progressList, pointCategories, pointLogs, homeworkList,
    };
    saveKey("students", students);
    saveKey("lessons", lessons);
    saveKey("fees", fees);
    saveKey("settled", settled);
    saveKey("quickTally", quickTally);
    saveKey("activePeriodic", activePeriodic);
    saveKey("trialRate", trialRate);
    saveKey("weaknessNotes", weaknessNotes);
    saveKey("examRecords", examRecords);
    saveKey("progressList", progressList);
    saveKey("pointCategories", pointCategories);
    saveKey("pointLogs", pointLogs);
    saveKey("homeworkList", homeworkList);
    setSyncStatus("syncing");
    const t = setTimeout(async () => {
      const ok = await cloudSave(state);
      setSyncStatus(ok ? "synced" : "error");
    }, 700);
    return () => clearTimeout(t);
  }, [students, lessons, fees, settled, quickTally, activePeriodic, trialRate, weaknessNotes, examRecords, progressList, pointCategories, pointLogs, homeworkList, ready]);

  const studentById = (id) => students.find((s) => s.id === id);

  function upsertLesson(lesson) {
    setLessons((prev) => {
      const idx = prev.findIndex((l) => l.id === lesson.id);
      if (idx === -1) return [...prev, lesson];
      const next = [...prev];
      next[idx] = lesson;
      return next;
    });
  }
  function removeLesson(id) { setLessons((prev) => prev.filter((l) => l.id !== id)); }
  function removeFee(id) { setFees((prev) => prev.filter((f) => f.id !== id)); }
  function quickAttend(lesson) { upsertLesson({ ...lesson, status: "attended" }); }
  function bulkAttendDay(dateLessons) {
    setLessons((prev) => prev.map((l) => {
      if (dateLessons.some((d) => d.id === l.id) && l.status === "scheduled") return { ...l, status: "attended" };
      return l;
    }));
  }
  function seriesSiblings(lesson) {
    if (!lesson?.seriesId) return [];
    return lessons.filter((l) => l.seriesId === lesson.seriesId && l.status === "scheduled" && l.id !== lesson.id);
  }
  function applyTimeToSeries(lesson, time, hours) {
    setLessons((prev) => prev.map((l) => {
      if (l.seriesId === lesson.seriesId && l.status === "scheduled") return { ...l, time, hours };
      return l;
    }));
  }
  function deleteSeries(lesson) {
    setLessons((prev) => prev.filter((l) => !(l.seriesId === lesson.seriesId && l.status === "scheduled")));
  }
  function toggleHomework(lessonId, hwId) {
    setLessons((prev) => prev.map((l) => {
      if (l.id !== lessonId) return l;
      return { ...l, homework: l.homework.map((h) => h.id === hwId ? { ...h, done: !h.done } : h) };
    }));
  }
  function feesFor(studentId, month) {
    const list = fees.filter((f) => f.studentId === studentId && f.month === month);
    const add = list.filter((f) => f.type === "add").reduce((a, f) => a + Number(f.amount || 0), 0);
    const disc = list.filter((f) => f.type === "discount").reduce((a, f) => a + Number(f.amount || 0), 0);
    return { add, disc };
  }

  const lessonsOn = (date) => lessons.filter((l) => l.date === date).sort((a, b) => (a.time || "").localeCompare(b.time || ""));

  const monthBreakdown = useMemo(() => {
    const key = monthKey(viewMonth);
    return students.map((s) => {
      const k = qKey(s.id, key);
      if (quickTally[k]) return null; // billed through the quick tally instead, don't double count
      const monthLessons = lessons.filter((l) => l.studentId === s.id && l.date.startsWith(key) && l.status === "attended");
      const billableLessons = monthLessons.filter(isBillable);
      const hours = billableLessons.reduce((a, l) => a + Number(l.hours || 0), 0);
      let base;
      if (s.billingType === "periodic") {
        const active = billableLessons.length > 0 || activePeriodic.includes(k);
        base = active ? Number(s.periodicAmount || 0) : 0;
      } else {
        base = billableLessons.reduce((a, l) => a + Number(l.hours || 0) * effectiveRate(l, s, trialRate), 0);
      }
      const { add, disc } = feesFor(s.id, key);
      const total = base + add - disc;
      const show = monthLessons.length > 0 || add > 0 || disc > 0 || (s.billingType === "periodic" && activePeriodic.includes(k));
      if (!show) return null;
      const hasTrial = monthLessons.some((l) => l.courseType === "試聽課");
      return { student: s, hours, base, add, disc, total, count: billableLessons.length, hasTrial, isSettled: settled.includes(k), key: k };
    }).filter(Boolean);
  }, [students, lessons, fees, settled, activePeriodic, quickTally, trialRate, viewMonth]);

  const quickBreakdown = useMemo(() => {
    const key = monthKey(viewMonth);
    return Object.keys(quickTally)
      .filter((k) => k.endsWith("|" + key))
      .map((k) => {
        const sid = k.slice(0, k.length - ("|" + key).length);
        const s = studentById(sid);
        if (!s) return null;
        const counts = quickTally[k];
        const { days, hours, fee } = calcQuick(counts, s.rate);
        const { add, disc } = feesFor(sid, key);
        const total = fee + add - disc;
        return { student: s, counts, days, hours, base: fee, add, disc, total, key, isSettled: settled.includes(k) };
      }).filter(Boolean);
  }, [quickTally, students, fees, settled, viewMonth]);

  const allRows = [...monthBreakdown, ...quickBreakdown];
  const monthTotal = allRows.reduce((a, b) => a + b.total, 0);
  const settledPct = allRows.length ? Math.round((allRows.filter((b) => b.isSettled).length / allRows.length) * 100) : 0;

  const scheduledPreview = useMemo(() => {
    const key = monthKey(viewMonth);
    const upcoming = lessons.filter((l) => l.status === "scheduled" && l.date.startsWith(key));
    const amount = upcoming.reduce((a, l) => {
      const s = studentById(l.studentId);
      if (!s) return a;
      const rate = l.courseType === "試聽課" ? Number(trialRate || 0) : Number(s.rate || 0);
      return a + Number(l.hours || 0) * rate;
    }, 0);
    return { count: upcoming.length, amount };
  }, [lessons, students, trialRate, viewMonth]);

  const homeworkItems = useMemo(() => {
    const items = [];
    lessons.forEach((l) => {
      (l.homework || []).forEach((h) => {
        items.push({ ...h, source: "lesson", lessonId: l.id, studentId: l.studentId, date: l.date });
      });
    });
    homeworkList.forEach((h) => {
      items.push({ ...h, source: "standalone", date: h.assignedDate });
    });
    return items.sort((a, b) => {
      const da = a.dueDate || a.date, db = b.dueDate || b.date;
      return db.localeCompare(da);
    });
  }, [lessons, homeworkList]);

  function addStandaloneHomework(studentId, text, dueDate) {
    setHomeworkList((prev) => [...prev, { id: uid(), studentId, text, assignedDate: todayStr(), dueDate: dueDate || "", done: false }]);
  }
  function toggleStandaloneHomework(id) {
    setHomeworkList((prev) => prev.map((h) => h.id === id ? { ...h, done: !h.done } : h));
  }
  function deleteHomeworkItem(item) {
    if (item.source === "standalone") {
      setHomeworkList((prev) => prev.filter((h) => h.id !== item.id));
    } else {
      setLessons((prev) => prev.map((l) => l.id === item.lessonId ? { ...l, homework: l.homework.filter((h) => h.id !== item.id) } : l));
    }
  }

  return (
    <AppErrorBoundary>
    <div style={S.shell}>
      <style>{CSS}</style>
      <div style={S.device}>
        <Header todayCount={lessonsOn(todayStr()).length} />
        <div style={S.banner}>
          {syncStatus === "syncing" && <span>☁️ 同步中…</span>}
          {syncStatus === "synced" && <span>☁️ 已同步雲端，換裝置打開也看得到最新資料</span>}
          {syncStatus === "error" && <span style={{ color: "var(--coral-text)" }}>⚠️ 雲端連線失敗，暫時只存在這台裝置的畫面上</span>}
        </div>

        <div style={S.content}>
          <TabErrorBoundary key={tab + "|" + (moreView || "")}>
          {tab === "schedule" && (
            <ScheduleTab
              calMode={calMode} setCalMode={setCalMode}
              viewMonth={viewMonth} setViewMonth={setViewMonth}
              selectedDate={selectedDate} setSelectedDate={setSelectedDate}
              lessons={lessons} lessonsOn={lessonsOn} studentById={studentById}
              students={students} examRecords={examRecords}
              onAddCourse={(date) => setScheduleForm({ date })}
              onOpenLesson={(l) => setActionSheet(l)}
              onBulkAttend={bulkAttendDay}
              onDayClick={(dateStr, dayLessons) => {
                if (dayLessons.length === 0) setScheduleForm({ date: dateStr });
                else if (dayLessons.length === 1) setActionSheet(dayLessons[0]);
                else setDayPeek({ date: dateStr, lessons: dayLessons });
              }}
            />
          )}
          {tab === "homework" && (
            <HomeworkTab
              items={homeworkItems} students={students} studentById={studentById}
              onToggleLesson={toggleHomework} onToggleStandalone={toggleStandaloneHomework}
              onAdd={addStandaloneHomework} onDelete={deleteHomeworkItem}
            />
          )}
          {tab === "billing" && (
            <BillingTab
              viewMonth={viewMonth} setViewMonth={setViewMonth}
              breakdown={monthBreakdown} quickBreakdown={quickBreakdown}
              total={monthTotal} pct={settledPct}
              students={students}
              quickTally={quickTally} setQuickTally={setQuickTally}
              activePeriodic={activePeriodic} setActivePeriodic={setActivePeriodic}
              trialRate={trialRate} setTrialRate={setTrialRate}
              scheduledPreview={scheduledPreview} lessons={lessons} fees={fees}
              onSettleAll={() => {
                setSettled((prev) => Array.from(new Set([...prev, ...[...monthBreakdown, ...quickBreakdown].map((b) => b.key)])));
              }}
              onUnsettleAll={() => {
                const keys = new Set([...monthBreakdown, ...quickBreakdown].map((b) => b.key));
                setSettled((prev) => prev.filter((k) => !keys.has(k)));
              }}
              onToggleSettle={(keys) => {
                setSettled((prev) => {
                  const allSettled = keys.every((k) => prev.includes(k));
                  if (allSettled) return prev.filter((k) => !keys.includes(k));
                  return Array.from(new Set([...prev, ...keys]));
                });
              }}
              onAddFee={(fee) => setFees((prev) => [...prev, { ...fee, id: uid(), month: monthKey(viewMonth) }])}
              onDeleteFee={removeFee}
            />
          )}
          {tab === "more" && !moreView && (
            <MoreMenu onSelect={setMoreView} />
          )}
          {tab === "more" && moreView && (
            <MoreDetail
              view={moreView} onBack={() => setMoreView(null)}
              students={students} setStudents={setStudents} lessons={lessons} studentById={studentById}
              onEditLesson={(l) => setLogForm(l)} onDeleteLesson={removeLesson}
              weaknessNotes={weaknessNotes} setWeaknessNotes={setWeaknessNotes}
              examRecords={examRecords} setExamRecords={setExamRecords}
              progressList={progressList} setProgressList={setProgressList}
              pointCategories={pointCategories} setPointCategories={setPointCategories}
              pointLogs={pointLogs} setPointLogs={setPointLogs}
            />
          )}
          </TabErrorBoundary>
        </div>

        <BottomNav
          tab={tab}
          onTab={(t) => { setTab(t); if (t !== "more") setMoreView(null); }}
          onLog={() => setLogForm({})}
        />
      </div>

      {logForm && (
        <LogFormModal
          initial={logForm} students={students} progressList={progressList} setProgressList={setProgressList}
          onClose={() => setLogForm(null)}
          onSave={(lesson) => { upsertLesson(lesson); setLogForm(null); }}
        />
      )}
      {scheduleForm && (
        <ScheduleFormModal
          students={students} initial={scheduleForm}
          onClose={() => setScheduleForm(null)}
          onSave={(newLessons) => { newLessons.forEach(upsertLesson); setScheduleForm(null); }}
        />
      )}
      {actionSheet && (
        <ActionSheet
          lesson={actionSheet} studentById={studentById}
          siblingCount={seriesSiblings(actionSheet).length}
          onClose={() => setActionSheet(null)}
          onAttend={() => { quickAttend(actionSheet); setActionSheet(null); }}
          onAttendWithLog={() => { setLogForm(actionSheet); setActionSheet(null); }}
          onLeave={() => { upsertLesson({ ...actionSheet, status: "leave" }); setActionSheet(null); }}
          onEditTime={() => { setEditTimeLesson(actionSheet); setActionSheet(null); }}
          onDelete={() => { removeLesson(actionSheet.id); setActionSheet(null); }}
          onDeleteSeries={() => { deleteSeries(actionSheet); setActionSheet(null); }}
        />
      )}
      {editTimeLesson && (
        <EditTimeModal
          lesson={editTimeLesson} siblingCount={seriesSiblings(editTimeLesson).length}
          onClose={() => setEditTimeLesson(null)}
          onSave={(l) => { upsertLesson(l); setEditTimeLesson(null); }}
          onSaveSeries={(time, hours) => { applyTimeToSeries(editTimeLesson, time, hours); setEditTimeLesson(null); }}
        />
      )}
      {dayPeek && (
        <DayPeekSheet
          date={dayPeek.date} lessons={dayPeek.lessons} studentById={studentById}
          onClose={() => setDayPeek(null)}
          onPickLesson={(l) => { setActionSheet(l); setDayPeek(null); }}
          onAddCourse={() => { setScheduleForm({ date: dayPeek.date }); setDayPeek(null); }}
        />
      )}
    </div>
    </AppErrorBoundary>
  );
}

class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: "sans-serif", maxWidth: 480, margin: "40px auto" }}>
          <div style={{ color: "#a64330", fontWeight: 700, fontSize: 16, marginBottom: 10 }}>應用程式出了點問題</div>
          <div style={{ color: "#6B7280", fontSize: 13, marginBottom: 10 }}>資料都還在雲端／裝置上，重新整理就會恢復。可以把下面這段訊息回報給開發者：</div>
          <pre style={{ whiteSpace: "pre-wrap", fontSize: 12, background: "#F1ECDF", padding: 12, borderRadius: 6, color: "#2A2A3B" }}>
            {String((this.state.error && this.state.error.message) || this.state.error)}
          </pre>
          <button
            style={{ marginTop: 14, padding: "10px 18px", background: "#232A3B", color: "#fff", border: "none", borderRadius: 6, cursor: "pointer" }}
            onClick={() => window.location.reload()}
          >重新整理頁面</button>
        </div>
      );
    }
    return this.props.children;
  }
}

class TabErrorBoundary extends React.Component {

function ScheduleTab({ calMode, setCalMode, viewMonth, setViewMonth, selectedDate, setSelectedDate, lessonsOn, studentById, onAddCourse, onOpenLesson, onBulkAttend, onDayClick, students, examRecords }) {
  const [filterStudentId, setFilterStudentId] = useState("");
  const year = viewMonth.getFullYear(), month = viewMonth.getMonth();
  const first = new Date(year, month, 1);
  const startWeekday = (first.getDay() + 6) % 7; // Monday-first: Mon=0 ... Sun=6
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const changeMonth = (delta) => setViewMonth(new Date(year, month + delta, 1));

  function filteredLessonsOn(date) {
    const all = lessonsOn(date);
    return filterStudentId ? all.filter((l) => l.studentId === filterStudentId) : all;
  }
  function examsOn(date) {
    return examRecords.filter((e) => {
      const inRange = date >= e.date && date <= (e.endDate || e.date);
      return inRange && (!filterStudentId || e.studentId === filterStudentId);
    });
  }

  return (
    <div>
      <div style={S.rowBetween}>
        <div style={S.tabToggle}>
          <button style={S.tabBtn(calMode === "day")} onClick={() => setCalMode("day")}>日視圖</button>
          <button style={S.tabBtn(calMode === "month")} onClick={() => setCalMode("month")}>月曆</button>
        </div>
        <select style={S.inputSm} value={filterStudentId} onChange={(e) => setFilterStudentId(e.target.value)}>
          <option value="">全部學生</option>
          {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </div>

      {calMode === "month" ? (
        <div style={S.card}>
          <div style={S.rowBetween}>
            <div style={S.monthTitle}>{year} 年 {month + 1} 月</div>
            <div style={{ display: "flex", gap: 6 }}>
              <button style={S.smallBtn} onClick={() => changeMonth(-1)}><ChevronLeft size={16} /> 上月</button>
              <button style={S.smallBtn} onClick={() => setViewMonth(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1))}>今天</button>
              <button style={S.smallBtn} onClick={() => changeMonth(1)}>下月 <ChevronRight size={16} /></button>
              <button style={S.darkBtn} onClick={() => onAddCourse()}><Plus size={14} /> 新增課</button>
            </div>
          </div>
          <div style={S.gridHead}>
            {WEEKDAYS.map((w) => <div key={w} style={S.gridHeadCell}>{w}</div>)}
          </div>
          <div style={S.grid}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} style={S.dayCellEmpty} />;
              const dateStr = fmt(new Date(year, month, d));
              const dayLessons = filteredLessonsOn(dateStr);
              const dayExams = examsOn(dateStr);
              const holiday = HOLIDAYS[dateStr];
              const isToday = dateStr === todayStr();
              return (
                <div key={i} style={S.dayCell(isToday, !!holiday)} onClick={() => onDayClick(dateStr, dayLessons)}>
                  <div style={S.dayNum(isToday)}>{d}</div>
                  {holiday && <div style={S.holidayLabel}>{holiday}</div>}
                  {dayExams.map((e) => (
                    <div key={e.id} style={S.examMarker}>📝 {studentById(e.studentId)?.name || "學生"} {e.examType}</div>
                  ))}
                  {dayLessons.slice(0, 3).map((l) => (
                    <div key={l.id} style={S.lessonChip(l.status)}>{l.time || ""} {studentById(l.studentId)?.name || "學生"}</div>
                  ))}
                  {dayLessons.length > 3 && <div style={S.moreLabel}>還有 {dayLessons.length - 3} 堂 ›</div>}
                </div>
              );
            })}
          </div>
          <div style={S.legendRow}>
            <span style={S.legendDot("#E7C79A")}></span>已排課
            <span style={{ ...S.legendDot("#9BC1A8"), marginLeft: 14 }}></span>已出席
            <span style={{ ...S.legendDot("#D98E86"), marginLeft: 14 }}></span>請假
            <span style={{ marginLeft: 14 }}>📝 段考</span>
          </div>
        </div>
      ) : (
        <DayView date={selectedDate} setDate={setSelectedDate} lessonsOn={filteredLessonsOn} studentById={studentById} onAddCourse={onAddCourse} onOpenLesson={onOpenLesson} onBulkAttend={onBulkAttend} />
      )}
    </div>
  );
}

  );
  const [materials, setMaterials] = useState(base.materials?.length ? base.materials : [{ id: uid(), material: "", content: "" }]);
  const [homework, setHomework] = useState(base.homework?.length ? base.homework : [{ id: uid(), text: "", done: false }]);
  const [showMore, setShowMore] = useState(false);
  const [extra, setExtra] = useState(base.extra || {});

  const studentTracks = progressList
    .filter((t) => t.studentId === studentId)

    return (

      }

    onSave({
      ...base,
      studentId, date, hours: Number(hours), courseType, status: "attended",
      rateOverride: rateOverride === "" ? null : Number(rateOverride),
      materials: materials.filter((m) => m.material || m.content).map(({ linkedTrackId, linkedUnitId, ...rest }) => rest),
      homework: homework.filter((h) => h.text),
      extra,
    });

  return (

                  <X size={16} style={{ cursor: "pointer", color: "var(--ink-soft)" }} onClick={() => setMaterials(materials.filter((r) => r.id !== m.id))} />

            );

          <button style={S.dashedBtn} onClick={() => setMaterials([...materials, { id: uid(), material: "", content: "" }])}>+ 新增一列</button>

          <label style={S.label}>回家作業（一項一格，可選填繳交期限）</label>
          {homework.map((h, i) => (
            <div key={h.id} style={S.rowInputs}>
              <span style={S.muted}>功課{i + 1}</span>
              <input style={{ ...S.inputSm, flex: 1 }} placeholder="例：習作 p.20-21" value={h.text} onChange={(e) => updateRow(homework, setHomework, h.id, "text", e.target.value)} />

              <X size={16} style={{ cursor: "pointer", color: "var(--ink-soft)" }} onClick={() => setHomework(homework.filter((r) => r.id !== h.id))} />
            </div>
          ))}
          <button style={S.dashedBtn} onClick={() => setHomework([...homework, { id: uid(), text: "", done: false }])}>+ 新增功課</button>

          <button style={S.moreToggle} onClick={() => setShowMore(!showMore)}>
            {showMore ? "－" : "＋"} 更多選項（學習狀況、考試、點數、弱點、附件）
          </button>
          {showMore && (
            <div style={S.moreBox}>
              <label style={S.label}>學習狀況</label>
              <input style={S.input} value={extra.learningStatus || ""} onChange={(e) => setExtra({ ...extra, learningStatus: e.target.value })} />
              <div style={S.twoCol}>
                <div>
                  <label style={S.label}>考試成績</label>
                  <input style={S.input} value={extra.examScore || ""} onChange={(e) => setExtra({ ...extra, examScore: e.target.value })} />
                </div>
                <div>
                  <label style={S.label}>點數表現（1-5）</label>
                  <input style={S.input} type="number" min="1" max="5" value={extra.points || ""} onChange={(e) => setExtra({ ...extra, points: e.target.value })} />
                </div>
              </div>
              <label style={S.label}>弱點記錄</label>
              <input style={S.input} value={extra.weakness || ""} onChange={(e) => setExtra({ ...extra, weakness: e.target.value })} />
              <label style={S.label}>附件備註</label>
              <input style={S.input} value={extra.attachmentNote || ""} onChange={(e) => setExtra({ ...extra, attachmentNote: e.target.value })} />
            </div>
          )}
        </div>
        {isEditing && <div style={{ ...S.editingBanner, margin: "0 18px" }}>✎ 正在編輯一筆既有紀錄</div>}
        <div style={{ ...S.btnRow, margin: "16px 18px 18px" }}>
          {isEditing && <button style={S.cancelBtnInline} onClick={onClose}>取消編輯</button>}
          <button style={S.primaryBtnInline} onClick={handleSave}>{isEditing ? "更新紀錄" : "儲存紀錄"}</button>
        </div>
      </div>
    </div>
  );
}

function HomeworkTab({ items, students, studentById, onToggleLesson, onToggleStandalone, onAdd, onDelete }) {
  const [tab, setTab] = useState("pending");
  const [filterStudent, setFilterStudent] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [newStudentId, setNewStudentId] = useState(students[0]?.id || "");
  const [newText, setNewText] = useState("");
  const [newDue, setNewDue] = useState("");

  const filtered = filterStudent ? items.filter((i) => i.studentId === filterStudent) : items;
  const pending = filtered.filter((i) => !i.done);
  const done = filtered.filter((i) => i.done);
  const list = tab === "pending" ? pending : tab === "done" ? done : filtered;

  function toggle(item) {
    if (item.source === "standalone") onToggleStandalone(item.id);
    else onToggleLesson(item.lessonId, item.id);
  }
  function handleAdd() {
    if (!newText.trim() || !newStudentId) return;
    onAdd(newStudentId, newText.trim(), newDue);
    setNewText(""); setNewDue("");
  }

  function isOverdue(item) {
    return !item.done && item.dueDate && item.dueDate < todayStr();
  }

  return (
    <div style={S.card}>
      <div style={S.rowInputs}>
        <select style={S.inputSm} value={filterStudent} onChange={(e) => setFilterStudent(e.target.value)}>
          <option value="">全部學生</option>
          {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <button style={S.smallBtn} onClick={() => setShowAdd(!showAdd)} disabled={students.length === 0}>{showAdd ? "取消" : "+ 快速新增作業"}</button>
      </div>

      {showAdd && (
        <div style={S.moreBox}>
          <label style={S.label}>學生</label>
          <select style={S.input} value={newStudentId} onChange={(e) => setNewStudentId(e.target.value)}>
            {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          <label style={S.label}>作業內容</label>
          <input style={S.input} placeholder="例：習作 p.20-21" value={newText} onChange={(e) => setNewText(e.target.value)} />
          <label style={S.label}>繳交期限（選填）</label>
          <input style={S.input} type="date" value={newDue} onChange={(e) => setNewDue(e.target.value)} />
          <button style={S.darkBtn} onClick={handleAdd}>+ 加入作業</button>
        </div>
      )}

      <div style={S.tabToggle}>
        <button style={S.tabBtn(tab === "pending")} onClick={() => setTab("pending")}>待追蹤</button>
        <button style={S.tabBtn(tab === "all")} onClick={() => setTab("all")}>全部</button>
        <button style={S.tabBtn(tab === "done")} onClick={() => setTab("done")}>已完成</button>
      </div>
      {list.length === 0 && <div style={S.emptyState}>目前沒有{tab === "pending" ? "待追蹤" : tab === "done" ? "已完成" : ""}的作業。</div>}
      {list.map((i) => (
        <div key={(i.lessonId || "s") + i.id} style={S.hwRow}>
          <input type="checkbox" checked={i.done} onChange={() => toggle(i)} style={{ width: 18, height: 18 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 500 }}>{i.text}</div>
            <div style={S.muted}>
              {studentById(i.studentId)?.name || "學生"} · {i.date}
              {i.dueDate && <span style={isOverdue(i) ? S.overdueTag : S.dueTag}>{isOverdue(i) ? `逾期 ${i.dueDate}` : `期限 ${i.dueDate}`}</span>}
            </div>
          </div>
          <X size={14} style={{ cursor: "pointer", color: "var(--ink-soft)" }} onClick={() => { if (window.confirm("確定要刪除這項作業嗎？")) onDelete(i); }} />
        </div>
      ))}
    </div>
  );
}

function BillingTab({
  viewMonth, setViewMonth, breakdown, quickBreakdown, total, pct, students,
  quickTally, setQuickTally, activePeriodic, setActivePeriodic, trialRate, setTrialRate, scheduledPreview, lessons, fees,
  onSettleAll, onUnsettleAll, onToggleSettle, onAddFee, onDeleteFee,
}) {
  const [previewModal, setPreviewModal] = useState(null); // { title, text }
  const [copiedPreview, setCopiedPreview] = useState(false);
  const monthLabel = `${viewMonth.getMonth() + 1}月`;

  function studentMonthLessons(studentId) {
    const key = monthKey(viewMonth);
    return lessons.filter((l) => l.studentId === studentId && l.date.startsWith(key) && l.status === "attended" && isBillable(l));
  }
  function hoursBreakdownFromQuickCounts(counts) {
    return DURATIONS.map((d, i) => ({ hours: d, count: Number(counts[i] || 0) })).filter((x) => x.count > 0);
  }
  function groupByRate(lns, student) {
    const map = {};
    lns.forEach((l) => {
      const rate = effectiveRate(l, student, trialRate);
      const isTrial = l.courseType === "試聽課";
      const label = isTrial ? "試聽課" : (rate !== Number(student.rate || 0) ? "調整價" : null);
      const key = `${rate}|${label || ""}`;
      if (!map[key]) map[key] = { rate, label, counts: {} };
      const h = Number(l.hours || 0);
      map[key].counts[h] = (map[key].counts[h] || 0) + 1;
    });
    return Object.values(map).map((g) => {
      const items = Object.keys(g.counts).map(Number).sort((a, b) => b - a).map((h) => ({ hours: h, count: g.counts[h] }));
      const days = items.reduce((a, x) => a + x.count, 0);
      const sumHours = items.reduce((a, x) => a + x.hours * x.count, 0);
      return { ...g, items, days, sumHours, fee: sumHours * g.rate };
    }).sort((a, b) => (a.label ? 1 : 0) - (b.label ? 1 : 0));
  }

  function feeItemsFor(studentId) {
    const key = monthKey(viewMonth);
    return fees.filter((f) => f.studentId === studentId && f.month === key);
  }

  function memberBlockLines(b) {
    if (b.student.billingType === "periodic") {
      const lines = [`${monthLabel}課程費用 NT$${b.base.toLocaleString()}`];
      feeItemsFor(b.student.id).forEach((f) => {
        lines.push(`${f.type === "add" ? "+" : "-"} ${f.note || (f.type === "add" ? "加收" : "折扣")} NT$${Number(f.amount).toLocaleString()}`);
      });
      lines.push(`本月總計：NT$${b.total.toLocaleString()}`);
      return lines;
    }
    const lines = [];
    let totalDays;
    if (b.days !== undefined) {
      const bd = hoursBreakdownFromQuickCounts(b.counts);
      bd.forEach((x) => lines.push(`${x.hours} 小時 × ${x.count} 天`));
      totalDays = bd.reduce((a, x) => a + x.count, 0);
    } else {
      const groups = groupByRate(studentMonthLessons(b.student.id), b.student);
      if (groups.length <= 1) {
        (groups[0]?.items || []).forEach((x) => lines.push(`${x.hours} 小時 × ${x.count} 天`));
      } else {
        groups.forEach((g) => {
          if (g.label) lines.push(`【${g.label}】`);
          g.items.forEach((x) => lines.push(`${x.hours} 小時 × ${x.count} 天`));
          lines.push(`小計：${g.sumHours} 小時 × NT$${g.rate} = NT$${g.fee.toLocaleString()}`);
          lines.push("");
        });
      }
      totalDays = groups.reduce((a, g) => a + g.days, 0);
    }
    lines.push(`本月共上 ${totalDays} 天・${b.hours} 小時`);
    const feeItems = feeItemsFor(b.student.id);
    if (feeItems.length > 0) {
      lines.push(`小計：NT$${b.base.toLocaleString()}`);
      feeItems.forEach((f) => {
        lines.push(`${f.type === "add" ? "+" : "-"} ${f.note || (f.type === "add" ? "加收" : "折扣")} NT$${Number(f.amount).toLocaleString()}`);
      });
    }
    lines.push(`本月費用：NT$${b.total.toLocaleString()}`);
    return lines;
  }

  function buildMessage(b) {
    const lines = [`${b.student.name}家長您好：`, `${monthLabel}課程時數：`, ...memberBlockLines(b), `再麻煩請您確認時數，謝謝您~`];
    return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  function buildFamilyMessage(group) {
    const lines = [`${group.household}家長您好：`, `${monthLabel}課程時數：`, ""];
    group.members.forEach((m) => {
      lines.push(`【${m.student.name}】`);
      lines.push(...memberBlockLines(m));
      lines.push("");
    });
    lines.push(`本月合計：NT$${group.total.toLocaleString()}`);
    lines.push(`再麻煩請您確認時數，謝謝您~`);
    return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  function groupRowsByHousehold(rows) {
    const groups = {};
    const singles = [];
    rows.forEach((r) => {
      const h = r.student.household;
      if (h) {
        if (!groups[h]) groups[h] = [];
        groups[h].push(r);
      } else {
        singles.push(r);
      }
    });
    const combined = Object.entries(groups).map(([household, members]) => ({
      household, members,
      total: members.reduce((a, m) => a + m.total, 0),
      isSettled: members.every((m) => m.isSettled),
      key: `household:${household}|${key}`,
    }));
    return { combined, singles };
  }



  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        return true;
      } catch (e2) {
        return false;
      }
    }
  }

  function openPreview(title, text) {
    setPreviewModal({ title, text });
    setCopiedPreview(false);
  }

  async function handleCopyPreview() {
    const ok = await copyText(previewModal.text);
    if (ok) {
      setCopiedPreview(true);
      setTimeout(() => setCopiedPreview(false), 1500);
    }
  }

  function buildLevelOverview() {
    const key = monthKey(viewMonth);
    const lines = [`${monthLabel}份：`];
    let grandTerms = [];
    ["mid", "elem"].forEach((lvl) => {
      const levelStudents = students.filter((s) => s.level === lvl && s.billingType !== "periodic");
      if (levelStudents.length === 0) return;
      const levelLessons = lessons.filter((l) =>
        levelStudents.some((s) => s.id === l.studentId) &&
        l.date.startsWith(key) && l.status === "attended" && isBillable(l)
      );
      if (levelLessons.length === 0) return;
      const hourTerms = levelLessons.map((l) => Number(l.hours || 0));
      const sumHours = hourTerms.reduce((a, h) => a + h, 0);
      const days = new Set(levelLessons.map((l) => l.date)).size;
      const rates = new Set(levelLessons.map((l) => effectiveRate(l, students.find((s) => s.id === l.studentId), trialRate)));
      let fee;
      let calcLine;
      if (rates.size === 1) {
        const rate = [...rates][0];
        fee = sumHours * rate;
        calcLine = `${sumHours}*${rate} = ${fee.toLocaleString()}`;
      } else {
        fee = levelLessons.reduce((a, l) => a + Number(l.hours || 0) * effectiveRate(l, students.find((s) => s.id === l.studentId), trialRate), 0);
        calcLine = `小計 NT$${fee.toLocaleString()}`;
      }
      lines.push(`${LEVELS[lvl]}共${days}天：`);
      lines.push(`時數：${hourTerms.join("+")} = ${sumHours}`);
      lines.push(calcLine);
      lines.push("");
      grandTerms.push(fee);
    });
    if (grandTerms.length > 1) {
      const grandTotal = grandTerms.reduce((a, f) => a + f, 0);
      lines.push(`${grandTerms.map((f) => f.toLocaleString()).join("+")} = ${grandTotal.toLocaleString()}`);
      lines.push("");
    }
    lines.push("再麻煩請您確認時數，謝謝您~");
    return lines.join("\n").trim();
  }

  const [feeStudentId, setFeeStudentId] = useState(students[0]?.id || "");
  const [feeAmount, setFeeAmount] = useState("");
  const [feeNote, setFeeNote] = useState("");
  const [feeType, setFeeType] = useState("add");
  const [expanded, setExpanded] = useState(true);
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [tallyLevel, setTallyLevel] = useState("");
  const [tallyStudentId, setTallyStudentId] = useState("");
  const key = monthKey(viewMonth);

  const periodicStudents = students.filter((s) => s.billingType === "periodic");
  const tallyCandidates = students.filter((s) =>
    s.billingType !== "periodic" &&
    !quickTally[qKey(s.id, key)] &&
    (!tallyLevel || s.level === tallyLevel)
  );

  function updateTallyCount(sid, idx, value) {
    setQuickTally((prev) => {
      const k = qKey(sid, key);
      const counts = [...(prev[k] || emptyCounts())];
      counts[idx] = value;
      return { ...prev, [k]: counts };
    });
  }
  function removeTally(sid) {
    setQuickTally((prev) => {
      const next = { ...prev };
      delete next[qKey(sid, key)];
      return next;
    });
  }
  function clearTallyCounts() {
    if (!window.confirm("確定要清空本月所有快速結算堂數嗎？學生名單會保留，只清空堂數與金額。")) return;
    setQuickTally((prev) => {
      const next = { ...prev };
      Object.keys(next).forEach((k) => { if (k.endsWith("|" + key)) next[k] = emptyCounts(); });
      return next;
    });
  }
  function togglePeriodicActive(sid) {
    const k = qKey(sid, key);
    setActivePeriodic((prev) => prev.includes(k) ? prev.filter((x) => x !== k) : [...prev, k]);
  }

  const forecastTotal = total + scheduledPreview.amount;
  const { combined: familyGroups, singles: singleRows } = groupRowsByHousehold([...breakdown, ...quickBreakdown]);

  return (
    <div>
      <div style={S.rowBetween}>
        <select style={S.monthSelect} value={key} onChange={(e) => {
          const [y, m] = e.target.value.split("-").map(Number);
          setViewMonth(new Date(y, m - 1, 1));
        }}>
          {Array.from({ length: 8 }).map((_, i) => {
            const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - 3 + i, 1);
            const k = monthKey(d);
            return <option key={k} value={k}>{k}</option>;
          })}
        </select>
        <button style={S.darkBtn} onClick={onSettleAll}>一鍵結算本月</button>
      </div>
      <div style={S.rowBetween}>
        <button style={S.linkBtn} onClick={() => { if (window.confirm("確定要把這個月全部取消結算嗎？")) onUnsettleAll(); }}>全部取消結算</button>
      </div>

      <div style={S.incomeCard}>
        <div style={S.twoStatRow}>
          <div>
            <div style={S.muted}>已確認收入</div>
            <div style={S.bigNumber}>NT${total.toLocaleString()}</div>
          </div>
          <div>
            <div style={S.muted}>本月預估總收入</div>
            <div style={S.bigNumberSecondary}>NT${forecastTotal.toLocaleString()}</div>
            {scheduledPreview.count > 0 && <div style={S.hintText}>含 {scheduledPreview.count} 堂已排課、尚未出席</div>}
          </div>
        </div>
        <button style={S.linkBtn} onClick={() => setExpanded(!expanded)}>{expanded ? "▲ 收起明細" : "▼ 查看每位學生明細"}</button>
        {expanded && (
          <div style={{ marginTop: 10 }}>
            {breakdown.length === 0 && quickBreakdown.length === 0 && (
              <div style={S.emptyState}>這個月還沒有課堂紀錄 → 去「排課」或「記一課」新增，或到下面「進階設定」用快速結算直接輸入堂數。</div>
            )}
            {familyGroups.map((g) => (
              <div key={g.key} style={S.billingRow}>
                <div>
                  <div style={{ fontWeight: 500 }}>{g.household}家 <span style={S.quickTag}>合併結算</span></div>
                  {g.members.map((m) => (
                    <div key={m.key} style={S.muted}>{m.student.name}：NT${m.total.toLocaleString()}</div>
                  ))}
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={S.moneyText}>NT${g.total.toLocaleString()}</div>
                  <button style={{ ...(g.isSettled ? S.settledTag : S.unsettledTag), ...S.settleToggleBtn }} onClick={() => onToggleSettle(g.members.map((m) => m.key))}>{g.isSettled ? "已結算" : "未結算"}</button>
                  <button style={S.copyBtn} onClick={() => openPreview("家長通知訊息", buildFamilyMessage(g))}>複製訊息</button>
                </div>
              </div>
            ))}
            {singleRows.map((b) => (
              <div key={b.key} style={S.billingRow}>
                <div>
                  <div style={{ fontWeight: 500 }}>{b.student.name} <LevelTag level={b.student.level} />{b.hasTrial && <span style={S.quickTag}>含試聽課</span>}{b.days !== undefined && <span style={S.quickTag}>快速結算</span>}</div>
                  <div style={S.muted}>
                    {b.student.billingType === "periodic" ? "月結定額" : b.days !== undefined ? `${b.days} 天 · ${b.hours} 小時` : `${b.count} 堂 · ${b.hours} 小時`}
                    {b.add > 0 ? ` · +NT$${b.add}` : ""}{b.disc > 0 ? ` · -NT$${b.disc}` : ""}
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={S.moneyText}>NT${b.total.toLocaleString()}</div>
                  <button style={{ ...(b.isSettled ? S.settledTag : S.unsettledTag), ...S.settleToggleBtn }} onClick={() => onToggleSettle([b.key])}>{b.isSettled ? "已結算" : "未結算"}</button>
                  <button style={S.copyBtn} onClick={() => openPreview("家長通知訊息", buildMessage(b))}>複製訊息</button>
                </div>
              </div>
            ))}

        )}
      </div>

      <button style={S.advancedToggle} onClick={() => setShowAdvanced(!showAdvanced)}>
        {showAdvanced ? "▲ 收起進階設定" : "▼ 進階設定（試聽課費率、月結、快速結算、加費折扣）"}
      </button>

      {showAdvanced && (
        <>
          <div style={S.rowBetween}>
            <button style={S.copyOverviewBtn} onClick={() => openPreview("本月總覽（依年級）", buildLevelOverview())}>
              📋 複製本月總覽（依年級）
            </button>
          </div>

          <div style={S.card}>
            <div style={S.rowInputs}>
              <span style={S.inlineLabel}>試聽課鐘點費</span>
              <input style={S.durInput} type="number" value={trialRate} onChange={(e) => setTrialRate(Number(e.target.value) || 0)} />
              <span style={S.muted}>元 / 小時</span>
            </div>
            <div style={S.muted}>只要課程類型選「試聽課」，結算時就自動用這個價錢，不會用學生原本的鐘點費。</div>
          </div>

          {periodicStudents.length > 0 && (
            <div style={S.card}>
              <div style={S.label}>月結學生（週期定額）</div>
              <div style={S.muted}>有排課紀錄的月結學生會自動列入；沒有逐堂排課的話，點一下標記「本月已上課」即可。</div>
              <div style={S.chipRow}>
                {periodicStudents.map((s) => {
                  const active = activePeriodic.includes(qKey(s.id, key));
                  return (
                    <button key={s.id} style={S.chip(active)} onClick={() => togglePeriodicActive(s.id)}>
                      {s.name}　NT${s.periodicAmount}{active ? " ✓" : ""}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          <div style={S.card}>
            <div style={S.rowBetween}>
              <div style={S.label}>快速結算（免逐堂排課，用天數直接算）</div>
            </div>
            <div style={S.muted}>不想每堂都排課的學生，直接選人、輸入這個月每種時數各上了幾天，鐘點費自動算好。</div>

            {tallyCandidates.length === 0 && Object.keys(quickTally).filter((k) => k.endsWith("|" + key)).length === 0 ? (
              <div style={S.emptyState}>目前沒有可加入的學生，先到「更多 → 學生名冊」新增。</div>
            ) : (
              <div style={S.pickerBox}>
                <div style={S.rowInputs}>
                  <select style={S.inputSm} value={tallyLevel} onChange={(e) => { setTallyLevel(e.target.value); setTallyStudentId(""); }}>
                    <option value="">年級</option>
                    <option value="elem">國小</option>
                    <option value="mid">國中</option>
                  </select>
                  <select style={{ ...S.inputSm, flex: 1 }} value={tallyStudentId} onChange={(e) => setTallyStudentId(e.target.value)} disabled={tallyCandidates.length === 0}>
                    <option value="">{tallyCandidates.length === 0 ? "這個年級沒有可加入的學生" : "選擇學生"}</option>
                    {tallyCandidates.map((s) => <option key={s.id} value={s.id}>{s.name}（{s.rate} 元/hr）</option>)}
                  </select>
                  <button
                    style={S.darkBtn}
                    disabled={!tallyStudentId}
                    onClick={() => {
                      setQuickTally((prev) => ({ ...prev, [qKey(tallyStudentId, key)]: emptyCounts() }));
                      setTallyStudentId("");
                    }}
                  >加入</button>
                </div>
              </div>
            )}

            {quickBreakdown.map((b) => (
              <div key={b.key} style={S.tallyCard}>
                <div style={S.rowBetween}>
                  <div style={{ fontWeight: 500 }}>{b.student.name} <LevelTag level={b.student.level} /></div>
                  <Trash2 size={16} style={{ cursor: "pointer", color: "var(--coral)" }} onClick={() => removeTally(b.student.id)} />
                </div>
                <div style={S.muted}>鐘點費 <span style={S.moneyText}>{b.student.rate}</span> 元 / 小時</div>
                <div style={S.durGrid}>
                  {DURATIONS.map((d, i) => (
                    <div key={d} style={{ textAlign: "center" }}>
                      <div style={S.durLabel}>{d} 小時</div>
                      <input
                        style={S.durInput} type="number" min="0"
                        value={quickTally[qKey(b.student.id, key)][i]}
                        onChange={(e) => updateTallyCount(b.student.id, i, e.target.value)}
                      />
                      <div style={S.durLabel}>天數</div>
                    </div>
                  ))}
                </div>
                <div style={S.rowBetween}>
                  <span style={S.muted}>本月共上 <strong>{b.days}</strong> 天・<strong>{b.hours}</strong> 小時</span>
                  <span style={S.moneyBig}>NT${b.base.toLocaleString()}</span>
                </div>
              </div>
            ))}
            {quickBreakdown.length > 0 && (
              <button style={S.dashedBtn} onClick={clearTallyCounts}>清空本月快速結算堂數</button>
            )}
          </div>

          <div style={S.card}>
            <div style={S.label}>本月其他費用／折扣</div>
            <div style={S.muted}>加收：教材費、講義費、車馬費　·　折扣：介紹費回饋、續約優惠、老客戶折扣</div>
            <div style={S.rowInputs}>
              <button style={S.tabBtn(feeType === "add")} onClick={() => setFeeType("add")}>＋ 加費</button>
              <button style={S.tabBtn(feeType === "discount")} onClick={() => setFeeType("discount")}>－ 折扣</button>
            </div>
            <div style={S.rowInputs}>
              <select style={S.inputSm} value={feeStudentId} onChange={(e) => setFeeStudentId(e.target.value)}>
                {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
              <input style={S.inputSm} placeholder="金額（請輸入正數）" type="number" value={feeAmount} onChange={(e) => setFeeAmount(e.target.value)} />
            </div>
            <input style={S.input} placeholder="說明，例：講義費／介紹費折扣／續約優惠" value={feeNote} onChange={(e) => setFeeNote(e.target.value)} />
            <button style={S.saveBtn} onClick={() => {
              if (!feeAmount || !feeStudentId) return;
              onAddFee({ studentId: feeStudentId, amount: Number(feeAmount), note: feeNote, type: feeType });
              setFeeAmount(""); setFeeNote("");
            }}>+ 加入費用</button>

            {(() => {
              const monthFees = fees.filter((f) => f.month === key);
              if (monthFees.length === 0) return null;
              return (
                <div style={{ marginTop: 14 }}>
                  <div style={S.label}>本月已加入的項目</div>
                  {monthFees.map((f) => {
                    const s = students.find((x) => x.id === f.studentId);
                    return (
                      <div key={f.id} style={S.feeItemRow}>
                        <span>
                          {s?.name || "未知學生"}　
                          <span style={{ color: f.type === "add" ? "var(--coral-text)" : "var(--green-text)" }}>
                            {f.type === "add" ? "+" : "-"}NT${Number(f.amount).toLocaleString()}
                          </span>
                          {f.note ? `　${f.note}` : ""}
                        </span>
                        <X size={14} style={{ cursor: "pointer", color: "var(--ink-soft)" }} onClick={() => onDeleteFee(f.id)} />
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        </>
      )}

      {previewModal && (
        <div style={S.overlay} onClick={() => setPreviewModal(null)}>
          <div style={S.modalSm} onClick={(e) => e.stopPropagation()}>
            <div style={S.modalHead}><span>{previewModal.title}</span><X size={18} style={{ cursor: "pointer" }} onClick={() => setPreviewModal(null)} /></div>
            <div style={S.muted}>訊息內容可以直接修改，改完再複製。</div>
            <textarea
              style={S.messageTextarea}
              rows={10}
              value={previewModal.text}
              onChange={(e) => setPreviewModal({ ...previewModal, text: e.target.value })}
            />
            <div style={{ ...S.btnRow, marginTop: 12 }}>
              <button style={S.cancelBtnInline} onClick={() => setPreviewModal(null)}>關閉</button>
              <button style={S.primaryBtnInline} onClick={handleCopyPreview}>{copiedPreview ? "已複製 ✓" : "複製訊息"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function LessonRecordsPage({ lessons, students, studentById, onEdit, onDelete }) {
  const [filterStudent, setFilterStudent] = useState("");
  const [filterMonth, setFilterMonth] = useState("");
  const [msgFor, setMsgFor] = useState(null);
  const [selected, setSelected] = useState(null);

  const months = Array.from(new Set(lessons.map((l) => l.date.slice(0, 7)))).sort().reverse();
  const records = lessons
    .filter((l) => l.status !== "scheduled")
    .filter((l) => !filterStudent || l.studentId === filterStudent)
    .filter((l) => !filterMonth || l.date.startsWith(filterMonth))
    .sort((a, b) => b.date.localeCompare(a.date));

  function statusLabel(l) {
    if (l.status === "leave") return { text: "請假不計費", style: S.coralTag, tone: "coral" };
    if (l.courseType === "請假（不計費）") return { text: "請假不計費", style: S.coralTag, tone: "coral" };
    if (l.courseType === "試聽課") return { text: "試聽課", style: S.goldTag, tone: "gold" };
    return { text: "已出席", style: S.greenTag, tone: "green" };
  }

  function buildLessonMessage(l) {
    const name = studentById(l.studentId)?.name || "學生";
    const tag = l.status === "leave" || l.courseType === "請假（不計費）" ? "（請假）" : "";
    const content = l.materials?.map((m) => [m.material, m.content].filter(Boolean).join("：")).filter(Boolean).join("\n") || "—";
    const hw = l.homework?.map((h) => h.text).filter(Boolean).join("\n") || "—";
    return `【${name} ${l.date} 課堂紀錄】${tag}\n📘 今天教學內容：\n${content}\n📝 回家作業：\n${hw}`;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        return true;
      } catch (e2) { return false; }
    }
  }

  return (
    <div>
      <div style={S.rowInputs}>
        <select style={S.inputSm} value={filterStudent} onChange={(e) => setFilterStudent(e.target.value)}>
          <option value="">全部學生</option>
          {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <select style={S.inputSm} value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)}>
          <option value="">全部月份</option>
          {months.map((m) => <option key={m} value={m}>{m}</option>)}
        </select>
      </div>

      {records.length === 0 && <div style={S.emptyState}>沒有符合條件的課堂紀錄。</div>}

      <div style={S.recordGrid}>
        {records.map((l) => {
          const s = statusLabel(l);
          const shortDate = l.date.slice(5).replace("-", "/");
          return (
            <button key={l.id} style={S.recordTile(s.tone)} onClick={() => setSelected(l)}>
              <div style={{ fontWeight: 600 }}>{studentById(l.studentId)?.name || "學生"}</div>
              <div style={S.recordTileDate}>{shortDate}</div>
              <div style={S.recordTileTag}>{s.text}</div>
            </button>
          );
        })}
      </div>

      {selected && (() => {
        const l = selected;
        const s = statusLabel(l);
        const content = l.materials?.map((m) => [m.material, m.content].filter(Boolean).join("：")).filter(Boolean).join("；") || "—";
        const hw = l.homework?.map((h) => h.text).filter(Boolean).join("；") || "—";
        return (
          <div style={S.overlay} onClick={() => setSelected(null)}>
            <div style={S.modalSm} onClick={(e) => e.stopPropagation()}>
              <div style={S.modalHead}>
                <span>{studentById(l.studentId)?.name || "學生"} <span style={s.style}>{s.text}</span></span>
                <X size={18} style={{ cursor: "pointer" }} onClick={() => setSelected(null)} />
              </div>
              <div style={S.muted}>{l.date} · {l.status === "leave" || l.courseType === "請假（不計費）" ? 0 : l.hours}hr</div>
              <div style={{ marginTop: 8 }}>教學內容：{content}</div>
              <div>回家作業：{hw}</div>
              <div style={{ ...S.rowInputs, marginTop: 14 }}>
                <button style={S.smallBtn} onClick={() => onEdit(l)}>編輯</button>
                <button style={S.smallBtn} onClick={() => { setMsgFor(l); setSelected(null); }}>產生通知訊息</button>
                <button style={{ ...S.smallBtn, color: "var(--coral)" }} onClick={() => { if (window.confirm("確定要刪除這堂課的紀錄嗎？刪除後不能復原，這個月的月費也會跟著變動。")) { onDelete(l.id); setSelected(null); } }}>刪除</button>
              </div>
            </div>
          </div>
        );
      })()}

      {msgFor && (
        <div style={S.overlay} onClick={() => setMsgFor(null)}>
          <div style={S.modalSm} onClick={(e) => e.stopPropagation()}>
            <div style={S.modalHead}><span>家長通知訊息</span><X size={18} style={{ cursor: "pointer" }} onClick={() => setMsgFor(null)} /></div>
            <div style={S.messagePreview}>{buildLessonMessage(msgFor)}</div>
            <div style={{ ...S.btnRow, marginTop: 14 }}>
              <button style={S.cancelBtnInline} onClick={() => setMsgFor(null)}>關閉</button>
              <button style={S.primaryBtnInline} onClick={() => copyText(buildLessonMessage(msgFor))}>複製訊息</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function StudentRoster({ students, setStudents, lessons }) {
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  const [level, setLevel] = useState("elem");
  const [rate, setRate] = useState(600);
  const [billingType, setBillingType] = useState("hourly");
  const [periodicAmount, setPeriodicAmount] = useState(0);
  const [household, setHousehold] = useState("");
  const [pageUrl, setPageUrl] = useState("");
  const [note, setNote] = useState("");
  const [expandedIds, setExpandedIds] = useState({});

  function addStudent() {
    if (!name) return;
    setStudents([...students, {
      id: uid(), name, level, rate: Number(rate), billingType,
      periodicAmount: Number(periodicAmount), household: household.trim(), pageUrl: pageUrl.trim(), note,
    }]);
    setName(""); setNote(""); setRate(600); setPeriodicAmount(0); setHousehold(""); setPageUrl(""); setBillingType("hourly"); setLevel("elem"); setAdding(false);
  }

  function updateField(id, field, value) {
    const numericFields = ["rate", "periodicAmount"];
    const v = field === "household" ? value.trim() : value;
    setStudents(students.map((s) => s.id === id ? { ...s, [field]: numericFields.includes(field) ? Number(v) : v } : s));
  }
  function toggleLevel(id) {
    setStudents(students.map((s) => s.id === id ? { ...s, level: s.level === "elem" ? "mid" : "elem" } : s));
  }
  function deleteStudent(s) {
    if (!window.confirm(`確定要刪除「${s.name}」的資料嗎？這個動作無法復原。`)) return;
    setStudents(students.filter((x) => x.id !== s.id));
  }
  function toggleExpand(id) {
    setExpandedIds((prev) => ({ ...prev, [id]: !prev[id] }));
  }
  const existingHouseholds = Array.from(new Set(students.map((s) => s.household).filter(Boolean)));

  return (
    <div>
      <div style={S.rowBetween}>
        <div>
          <div style={S.label}>學生名冊</div>
          <div style={S.muted}>點學生可展開編輯；同家庭填一樣的名稱，月費會自動合併結算</div>
        </div>
        <button style={S.darkBtn} onClick={() => setAdding(!adding)}><UserPlus size={14} /> 新增學生</button>
      </div>
      {adding && (
        <div style={S.moreBox}>
          <label style={S.label}>姓名</label>
          <input style={S.input} value={name} onChange={(e) => setName(e.target.value)} />
          <label style={S.label}>年級</label>
          <select style={S.input} value={level} onChange={(e) => setLevel(e.target.value)}>
            <option value="elem">國小</option>
            <option value="mid">國中</option>
          </select>
          <label style={S.label}>收費方式</label>
          <select style={S.input} value={billingType} onChange={(e) => setBillingType(e.target.value)}>
            <option value="hourly">單堂鐘點費</option>
            <option value="periodic">週期定額（月結）</option>
          </select>
          {billingType === "periodic" ? (
            <>
              <label style={S.label}>每月定額（NT$）</label>
              <input style={S.input} type="number" value={periodicAmount} onChange={(e) => setPeriodicAmount(e.target.value)} />
            </>
          ) : (
            <>
              <label style={S.label}>每小時鐘點費（NT$）</label>
              <input style={S.input} type="number" value={rate} onChange={(e) => setRate(e.target.value)} />
            </>
          )}
          <label style={S.label}>所屬家庭（同家庭的手足會合併結算，例：王家；沒有就留空）</label>
          <input style={S.input} list="household-list" value={household} onChange={(e) => setHousehold(e.target.value)} placeholder="例：王家" />
          <label style={S.label}>學生成效頁網址（選填，例如給家長看的頁面）</label>
          <input style={S.input} value={pageUrl} onChange={(e) => setPageUrl(e.target.value)} placeholder="例：math-plan.html 或完整網址" />
          <label style={S.label}>備註</label>
          <input style={S.input} value={note} onChange={(e) => setNote(e.target.value)} />
          <button style={S.saveBtn} onClick={addStudent}>儲存學生</button>
        </div>
      )}
      {students.length === 0 && !adding && <div style={S.emptyState}>還沒有學生，點右上角「新增學生」開始。</div>}
      <datalist id="household-list">
        {existingHouseholds.map((h) => <option key={h} value={h} />)}
      </datalist>
      {students.map((s) => {
        const isOpen = !!expandedIds[s.id];
        return (
          <div key={s.id} style={S.studentCard}>
            <div style={{ ...S.rowBetween, cursor: "pointer", marginBottom: 0 }} onClick={() => toggleExpand(s.id)}>
              <div style={S.rowInputs}>
                <span style={{ fontWeight: 700, fontSize: 15 }}>{s.name}</span>
                <span style={S.levelTag(s.level)}>{LEVELS[s.level]}</span>
                {s.household && <span style={S.familyTag}>👨‍👩‍👧 {s.household}家</span>}
                <span style={S.muted}>{s.billingType === "periodic" ? `月結 NT$${s.periodicAmount}` : `NT$${s.rate}/hr`}</span>
                {s.pageUrl && (
                  <a href={s.pageUrl} target="_blank" rel="noopener noreferrer" style={S.pageLinkIcon} onClick={(e) => e.stopPropagation()} title="開啟學生成效頁">🔗</a>
                )}
              </div>

function MaterialTrack({ track, onUpdate, onDelete }) {
  const units = track.units || [];
  const [open, setOpen] = useState(false);
  const [newUnit, setNewUnit] = useState("");
  const [pasteText, setPasteText] = useState("");
  const [autoExpand, setAutoExpand] = useState(true);
  const [showPaste, setShowPaste] = useState(false);

  function addUnit() {
    if (!newUnit.trim()) return;
    onUpdate({ units: [...units, { id: uid(), name: newUnit.trim(), done: false }] });
    setNewUnit("");
  }
  function toggleUnit(unitId) {
    onUpdate({ units: units.map((u) => u.id === unitId ? { ...u, done: !u.done } : u) });
  }
  function removeUnit(unitId) {
    onUpdate({ units: units.filter((u) => u.id !== unitId) });
  }
  function bulkAdd() {
    const lines = pasteText.split("\n").map((l) => l.trim()).filter(Boolean);
    const added = [];
    lines.forEach((line) => {
      if (/花路米|^CHAPTER\b/i.test(line)) return; // skip appendix/review sections and chapter-title lines
      const clean = line.replace(/\s*\d+\s*$/, "").trim(); // strip trailing page numbers
      if (!clean) return;
      if (autoExpand) {
        added.push({ id: uid(), name: `${clean} 例題`, done: false });
        added.push({ id: uid(), name: `${clean} 自我評量`, done: false });
      } else {
        added.push({ id: uid(), name: clean, done: false });
      }
    });
    if (added.length) onUpdate({ units: [...units, ...added] });
    setPasteText("");
    setShowPaste(false);
  }

  const doneCount = units.filter((u) => u.done).length;
  const pct = units.length ? Math.round((doneCount / units.length) * 100) : 0;

  return (
    <div style={S.trackCard}>
      <div style={{ ...S.rowBetween, cursor: "pointer", marginBottom: 0 }} onClick={() => setOpen(!open)}>
        <div style={S.rowInputs}>
          <span style={{ fontWeight: 600 }}>{track.material || "（未命名教材）"}</span>
          <span style={S.muted}>{pct}%（{doneCount}/{units.length}）</span>
        </div>
        <span style={S.expandArrow}>{open ? "▲" : "▼"}</span>
      </div>
      {open && (
        <div style={{ marginTop: 10 }}>
          <label style={S.label}>使用教材</label>
          <input style={S.input} placeholder="例：南一國三數學課本" value={track.material} onChange={(e) => onUpdate({ material: e.target.value })} />
          <div style={S.progressTrack}><div style={S.progressFill(pct)} /></div>

          <div style={S.trackUnitList}>
            {units.length === 0 && <div style={{ ...S.emptyState, padding: "12px 0" }}>尚未新增單元</div>}
            {units.map((u) => (
              <div key={u.id} style={S.hwRow}>
                <input type="checkbox" checked={u.done} onChange={() => toggleUnit(u.id)} style={{ width: 18, height: 18 }} />
                <div style={{ flex: 1, textDecoration: u.done ? "line-through" : "none", color: u.done ? "var(--ink-soft)" : "var(--ink)" }}>{u.name}</div>
                <X size={14} style={{ cursor: "pointer", color: "var(--ink-soft)" }} onClick={() => removeUnit(u.id)} />
              </div>
            ))}
          </div>

          <div style={{ ...S.rowInputs, marginTop: 10 }}>
            <input style={{ ...S.input, flex: 1 }} placeholder="新增單元，例：Unit 6 長母音 oa/ow" value={newUnit} onChange={(e) => setNewUnit(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addUnit()} />
            <button style={S.darkBtn} onClick={addUnit}>+ 新增</button>
          </div>

          <button style={S.moreToggle} onClick={() => setShowPaste(!showPaste)}>{showPaste ? "－" : "＋"} 貼上目錄，一次新增多筆</button>
          {showPaste && (
            <div style={S.moreBox}>
              <div style={S.muted}>把課本目錄整段貼進來，一行一個章節，我會自動拆成清單（跳過含「花路米」或「CHAPTER」的行）。</div>
              <textarea style={S.textarea} rows={5} placeholder={"例：\n1-1 連比\n1-2 比例線段\n1-3 相似形"} value={pasteText} onChange={(e) => setPasteText(e.target.value)} />
              <label style={S.checkboxRow}>
                <input type="checkbox" checked={autoExpand} onChange={(e) => setAutoExpand(e.target.checked)} />
                每個章節自動加上「例題」與「自我評量」兩筆
              </label>
              <button style={S.darkBtn} onClick={bulkAdd}>批次新增</button>
            </div>
          )}

          <button style={{ ...S.dashedBtn, marginTop: 10, color: "var(--coral)", borderColor: "var(--coral)" }} onClick={onDelete}>刪除這個教材</button>
        </div>
      )}
    </div>
  );
}

function ProgressPage({ students, progressList, setProgressList }) {
  const [studentId, setStudentId] = useState(students[0]?.id || "");

  useEffect(() => {
    const needsFix = progressList.some((t) => !t.id || !t.units);
    if (needsFix) {
      setProgressList((prev) => prev.map((t) => ({ units: [], ...t, id: t.id || uid() })));
    }
  }, []);

  function addTrack() {
    setProgressList((prev) => [...prev, { id: uid(), studentId, material: "", units: [] }]);
  }
  function updateTrackById(id, patch) {
    setProgressList((prev) => prev.map((t) => t.id === id ? { ...t, ...patch } : t));
  }
  function deleteTrack(id) {
    if (!window.confirm("確定要刪除這個教材的進度紀錄嗎？")) return;
    setProgressList((prev) => prev.filter((t) => t.id !== id));
  }

  const tracks = progressList
    .filter((t) => t.studentId === studentId)
    .map((t) => ({ id: t.id || `${t.studentId}-legacy-${t.material || ""}`, units: [], ...t }));

  if (students.length === 0) return <div style={S.emptyState}>還沒有學生，先到「學生名冊」新增。</div>;

  return (
    <div>
      <div style={S.rowBetween}>
        <div style={{ flex: 1 }}>
          <div style={S.label}>選擇學生</div>
          <select style={S.input} value={studentId} onChange={(e) => setStudentId(e.target.value)}>
            {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>
      </div>
      <button style={S.darkBtn} onClick={addTrack}>+ 新增教材</button>
      {tracks.length === 0 && <div style={{ ...S.emptyState, padding: "20px 0" }}>這位學生還沒有教材，點上面新增一本開始追蹤進度</div>}
      {tracks.map((t) => (
        <MaterialTrack key={t.id} track={t} onUpdate={(patch) => updateTrackById(t.id, patch)} onDelete={() => deleteTrack(t.id)} />
      ))}
    </div>
  );
}
